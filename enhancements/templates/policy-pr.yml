# E10 — policy as code: copy this workflow into the repository your clusters are reconciled from (Argo CD, Flux,
# or `kubectl apply` in a pipeline). Given a Hubble flows file committed to that repository, it runs `cf2cnp merge`
# against the policy file for that workload (or generates it the first time), validates the result against the
# CiliumNetworkPolicy CRD offline, and opens a pull request with the diff. Nothing reaches a cluster until the PR
# merges and the reconciler picks it up. cf2cnp stays git-agnostic; this file is the integration.
#
# Prerequisite (first-run finding, demo 32): the repository's Actions setting "Allow GitHub Actions to create and
# approve pull requests" must be on, or the last step fails with "GitHub Actions is not permitted to create or approve
# pull requests" — the `permissions:` block below is necessary but not sufficient. Organisations that keep the setting
# off give the step a token of its own (a GitHub App or a PAT via `token:`) instead.
name: Policy from flows → pull request

on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Path to a Hubble flows file (NDJSON: `hubble observe -o json`) in this repository"
        required: true
      policy:
        description: "Path to the CiliumNetworkPolicy file to evolve (created on the first run)"
        required: true
      l7:
        description: "Emit layer-7 rules (the port then goes through the proxy)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  CF2CNP_VERSION: "0.6.1"          # 0.6.0 brought `merge` and the binaries; 0.6.1 keeps the merged file as it was (one rule per PR diff)
  CILIUM_VERSION: "v1.20.1"        # the CRD the policy is validated against — your cluster's Cilium version

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cf2cnp (release archive, checksum verified)
        env:
          VERSION: ${{ env.CF2CNP_VERSION }}
        run: |
          set -eu
          base="https://github.com/ephico2real2/cf2cnp/releases/download/v${VERSION}"
          tmp=$(mktemp -d)                                              # never inside the checkout (review finding)
          archive="cf2cnp_${VERSION}_linux_amd64.tar.gz"                 # the asset's own name: the checksum line names it (first run finding)
          curl -sSL -o "$tmp/$archive"        "$base/$archive"
          curl -sSL -o "$tmp/checksums.txt"   "$base/cf2cnp_${VERSION}_checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" && sudo install "$tmp/cf2cnp" /usr/local/bin/cf2cnp && rm -rf "$tmp"
          cf2cnp --help | head -3

      - name: Merge the flows into the policy (or generate it the first time)
        # inputs reach the shell through the environment, never through ${{ }} in the script (script-injection guidance)
        env:
          FLOWS: ${{ inputs.flows }}
          POLICY: ${{ inputs.policy }}
          L7: ${{ inputs.l7 }}
        run: |
          set -eu
          l7=""; [ "$L7" = "true" ] && l7="--l7"
          if [ -f "$POLICY" ]; then
            cf2cnp merge --existing "$POLICY" --input "$FLOWS" $l7
          else
            out=$(mktemp -d)
            mkdir -p "$(dirname "$POLICY")"
            cf2cnp generate --input "$FLOWS" --output "$out" $l7      # 0.6.0: a flows FILE, not its whole directory
            n=$(ls "$out"/*.yaml | wc -l); [ "$n" -eq 1 ] || { echo "the flows produce $n policies; one policy file per workload — filter the flows" >&2; exit 1; }
            mv "$out"/*.yaml "$POLICY"; rm -rf "$out"
          fi
          git diff --stat -- "$POLICY" || true

      - uses: actions/setup-go@v5          # ubuntu-latest ships no Go; kubectl-validate runs with `go run`
        with:
          go-version: "1.24"

      - name: Validate against the CiliumNetworkPolicy CRD (offline)
        # kubectl-validate's --local-crds takes a DIRECTORY of CRD files; the CRD lives outside the checkout
        env:
          POLICY: ${{ inputs.policy }}
          CILIUM_VERSION: ${{ env.CILIUM_VERSION }}
        run: |
          set -eu
          crds=$(mktemp -d)
          curl -sSL -o "$crds/ciliumnetworkpolicies.yaml" "https://raw.githubusercontent.com/cilium/cilium/${CILIUM_VERSION}/pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnetworkpolicies.yaml"
          go run sigs.k8s.io/kubectl-validate@v0.0.4 --local-crds "$crds" "$POLICY"
          rm -rf "$crds"

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ${{ inputs.policy }}          # only the policy file is committed (review finding)
          branch: policy/${{ github.run_id }}
          title: "policy: ${{ inputs.policy }} from ${{ inputs.flows }}"
          commit-message: "policy: evolve ${{ inputs.policy }} from observed flows"
          body: |
            Generated by `cf2cnp merge` from `${{ inputs.flows }}`${{ inputs.l7 && ' with layer-7 rules' || '' }}.
            Review the rules against the intent: every rule is a transcript of an observed flow, not a decision.
            Nothing is applied until this merges and the reconciler picks it up.
