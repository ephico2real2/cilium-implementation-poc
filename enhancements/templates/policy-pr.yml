# E10 — policy as code: copy this workflow into the repository your clusters are reconciled from (Argo CD, Flux,
# or `kubectl apply` in a pipeline). Given a Hubble flows file committed to that repository, it runs `cf2cnp merge`
# against the policy file for that workload (or generates it the first time), validates the result against the
# CiliumNetworkPolicy CRD offline, and opens a pull request with the diff. Nothing reaches a cluster until the PR
# merges and the reconciler picks it up. cf2cnp stays git-agnostic; this file is the integration.
name: Policy from flows → pull request

on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Path to a Hubble flows file (NDJSON: `hubble observe -o json`) in this repository"
        required: true
      policy:
        description: "Path to the CiliumNetworkPolicy file to evolve (created on the first run)"
        required: true
      l7:
        description: "Emit layer-7 rules (the port then goes through the proxy)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  CF2CNP_VERSION: "0.6.0"          # the first fork release that carries `merge` and the binaries
  CILIUM_VERSION: "v1.20.1"        # the CRD the policy is validated against — your cluster's Cilium version

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cf2cnp
        run: |
          curl -sSL -o cf2cnp.tgz "https://github.com/ephico2real2/cf2cnp/releases/download/v${CF2CNP_VERSION}/cf2cnp_${CF2CNP_VERSION}_linux_amd64.tar.gz"
          tar -xzf cf2cnp.tgz && sudo install cf2cnp /usr/local/bin/cf2cnp && cf2cnp --help | head -3

      - name: Merge the flows into the policy (or generate it the first time)
        run: |
          set -eu
          L7=""; [ "${{ inputs.l7 }}" = "true" ] && L7="--l7"
          if [ -f "${{ inputs.policy }}" ]; then
            cf2cnp merge --existing "${{ inputs.policy }}" --input "${{ inputs.flows }}" $L7
          else
            mkdir -p out "$(dirname "${{ inputs.policy }}")"
            cf2cnp generate --input "$(dirname "${{ inputs.flows }}")" --output out $L7
            n=$(ls out/*.yaml | wc -l); [ "$n" -eq 1 ] || { echo "the flows produce $n policies; one policy file per workload — filter the flows" >&2; exit 1; }
            mv out/*.yaml "${{ inputs.policy }}"
          fi
          git diff --stat -- "${{ inputs.policy }}" || true

      - name: Validate against the CiliumNetworkPolicy CRD (offline)
        # kubectl-validate's --local-crds takes a DIRECTORY of CRD files (measured: `--local-crds=./path/to/crds/dir`),
        # so the CRD goes into its own directory, not next to the policies
        run: |
          mkdir -p .cilium-crds
          curl -sSL -o .cilium-crds/ciliumnetworkpolicies.yaml "https://raw.githubusercontent.com/cilium/cilium/${CILIUM_VERSION}/pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnetworkpolicies.yaml"
          go run sigs.k8s.io/kubectl-validate@v0.0.4 --local-crds .cilium-crds --version 1.36 "${{ inputs.policy }}"
          rm -rf .cilium-crds

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: policy/${{ github.run_id }}
          title: "policy: ${{ inputs.policy }} from ${{ inputs.flows }}"
          commit-message: "policy: evolve ${{ inputs.policy }} from observed flows"
          body: |
            Generated by `cf2cnp merge` from `${{ inputs.flows }}`${{ inputs.l7 && ' with layer-7 rules' || '' }}.
            Review the rules against the intent: every rule is a transcript of an observed flow, not a decision.
            Nothing is applied until this merges and the reconciler picks it up.
