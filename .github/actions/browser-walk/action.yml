# browser-walk — Playwright on the runner, pinned and cached, driven through a YAML spec of pages: the lab's dashboards
# today, any endpoint of the operator's choice tomorrow (a new entry in the spec, not new code). Chromium resolves the
# lab's names itself from the spec's "resolve" map, so no /etc/hosts. Outputs a PNG and an evidence line per page, and —
# because a job summary renders Markdown but strips data: URIs and cannot reach artifact files (community discussion
# #35932) — pushes the PNGs to a branch of this public repository, one folder per run, and links them raw from the job
# summary, so the captures are ON the run page. The folder: <UTC time>_<workflow>_run<id>-<attempt>_<job>.
# The pages' expectations (the spec's `expect`) are a test: the captures are published FIRST, so the evidence is on the
# run page either way, and then the step fails when a page failed (walk.js exits 2).
name: browser walk (Playwright)
description: Drive Chromium through the pages of a YAML spec — screenshots and evidence lines on the run page, expectations measured
inputs:
  spec:               {description: the spec of pages, YAML or JSON (scripts/capture/walk.js's format), default: scripts/capture/lab.yaml}
  out:                {description: the directory for the PNGs and the log, default: captures}
  playwright-version: {description: the Playwright release, pinned, default: "1.63.0"}
  js-yaml-version:    {description: the js-yaml release the walker reads YAML with, pinned, default: "4.1.0"}
  env-json:           {description: 'extra variables for the spec''s ${VAR}s, as JSON, e.g. {"GW":"172.18.255.240"}', default: "{}"}
  publish-branch:     {description: the branch the captures are pushed to for the job summary ("" = do not publish; needs contents write), default: ci-captures}
runs:
  using: composite
  steps:
    - name: Playwright ${{ inputs.playwright-version }} and Chromium (cached by version)
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          .tmp/pw/node_modules
          ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.playwright-version }}-yaml${{ inputs.js-yaml-version }}
    - name: Install when not cached
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p .tmp/pw && cd .tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund "playwright@${{ inputs.playwright-version }}" "js-yaml@${{ inputs.js-yaml-version }}" >/dev/null
        npx playwright install --with-deps chromium >/dev/null 2>&1
    - name: The OS libraries Chromium needs (present on a cache hit too)
      shell: bash
      run: cd .tmp/pw && npx playwright install-deps chromium >/dev/null 2>&1 || true
    - name: Walk
      shell: bash
      run: |
        mkdir -p "${{ inputs.out }}"
        eval "$(echo '${{ inputs.env-json }}' | python3 -c 'import json,sys,shlex; [print(f"export {k}={shlex.quote(str(v))}") for k,v in json.load(sys.stdin).items()]')"
        # the walk's exit code is kept for the last step: the captures publish first, then the step fails on a failed page
        set +e; S="${{ inputs.out }}" NODE_PATH="$PWD/.tmp/pw/node_modules" node scripts/capture/walk.js "${{ inputs.spec }}" 2>&1 | tee "${{ inputs.out }}/walk.log"; echo "${PIPESTATUS[0]}" > "${{ inputs.out }}/walk.rc"; set -e
        ls -la "${{ inputs.out }}"/*.png 2>/dev/null | awk '{print "  " $5, $9}'
    - name: Publish to the branch and the job summary
      if: inputs.publish-branch != ''
      shell: bash
      run: |
        set -o pipefail
        OUT="${{ inputs.out }}"; BR="${{ inputs.publish-branch }}"; REPO="${{ github.repository }}"
        ls "$OUT"/*.png >/dev/null 2>&1 || { echo "no captures to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
        # the workflow's FILE name (lab-observability), not its display name — the first published folder carried the
        # display name mangled to 80 characters of dashes
        REF="${{ github.workflow_ref }}"; REF="${REF%%@*}"; WF=$(basename "$REF" | sed -E 's/\.ya?ml$//'); DIR="$(date -u +%Y-%m-%dT%H%MZ)_${WF}_run${{ github.run_id }}-${{ github.run_attempt }}_${{ github.job }}"
        git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        rm -rf .tmp/cap; git worktree prune
        if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then git fetch -q origin "$BR" && git worktree add -q .tmp/cap "origin/$BR"
        else git worktree add -q --detach .tmp/cap && (cd .tmp/cap && git checkout -q --orphan "$BR" && git rm -rfq . >/dev/null 2>&1 || true); fi
        mkdir -p ".tmp/cap/$DIR" && cp "$OUT"/*.png "$OUT"/walk.log ".tmp/cap/$DIR/"
        (cd .tmp/cap && git add -A && git commit -qm "captures: $DIR" && git push -q origin "HEAD:$BR")
        {
          echo "## Captures — [\`$DIR\`](https://github.com/$REPO/tree/$BR/$DIR)"
          echo; echo "The pages as the runner saw them, each with the walk's evidence line (panels, the \"No data\" panels by name, the text found) and its expectations' verdict. The same files are in the run's artifact."
          echo; while IFS= read -r line; do case "$line" in *FAILED*) echo "- ❌ \`$line\`";; *"expectations met"*) echo "- ✅ \`$line\`";; *) echo "- \`$line\`";; esac; done < "$OUT/walk.log"
          for f in "$OUT"/*.png; do n=$(basename "$f" .png); echo; echo "### $n"; echo; echo "![$n](https://raw.githubusercontent.com/$REPO/$BR/$DIR/$n.png)"; done
        } >> "$GITHUB_STEP_SUMMARY"
        echo "captures published: https://github.com/$REPO/tree/$BR/$DIR"
    - name: The pages' expectations
      shell: bash
      run: |
        rc=$(cat "${{ inputs.out }}/walk.rc" 2>/dev/null || echo 1)
        if [ "$rc" != 0 ]; then grep -E 'FAILED|page\(s\) failed' "${{ inputs.out }}/walk.log" | sed 's/^/::error::/'; exit "$rc"; fi
        echo "every page met its expectations ($(grep -c 'expectations met' "${{ inputs.out }}/walk.log") with expectations)"
