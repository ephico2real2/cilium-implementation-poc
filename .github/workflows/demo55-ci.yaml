# Demo 55 end to end on a runner: the node LAN, a kind cluster on it, the
# four-router fabric with the cluster overlay, every gate, the recorded apply
# and its screenshots, check.sh, and a packet carried to an announced address.
#
# Demo 55 and not demo 46 because demo 46 runs on Colima, and Colima does not
# start on a GitHub-hosted runner: it needs nested virtualisation, which the
# hosted images do not have (abiosoft/colima#696, actions/runner-images#7541).
# Demo 55 is the same fabric on a plain Docker engine — which is precisely
# what a Linux runner is — so this proves the lab on the machine that can
# actually run it, and demo 46 is proved on a Mac by
# scripts/demo46-colima-e2e.sh.
#
# The fabric, the dashboard and the router agent are NOT in this repository —
# they are pinned in scripts/bgp-fabric.env and built by
# github.com/ephico2real2/bgp-fabric's own CI. This workflow therefore proves
# the thing a unit test cannot: that the pinned commit, the published images
# and this lab's compose still make a working fabric together.
#
# A runner has one Docker engine and no Colima, which is what CTX=default and
# FABRIC_ANY_CONTEXT=1 are for. contents: write is only for the ci-captures
# branch — a job summary strips data: URIs and cannot read artifacts, so the
# screenshots need somewhere a Markdown image tag can reach.
name: demo55-ci

on:
  push:
    branches: [main]
    paths:
      - 'demos/55-bgp-fabric-desktop/**'
      - 'demos/46-bgp-fabric-colima/**'
      - 'scripts/fabric-*.sh'
      - 'scripts/bgp-fabric*'
      - 'scripts/eg-net.sh'
      - 'tests/**'
      - '.github/workflows/demo55-ci.yaml'
  pull_request:
    paths:
      - 'demos/55-bgp-fabric-desktop/**'
      - 'demos/46-bgp-fabric-colima/**'
      - 'scripts/fabric-*.sh'
      - 'scripts/bgp-fabric*'
      - 'scripts/eg-net.sh'
      - 'tests/**'
      - '.github/workflows/demo55-ci.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo55:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No job-level CTX or FABRIC_ANY_CONTEXT. The Desktop demo-46 path calls
    # plain `docker` and needs neither — and setting them here changed what the
    # colima-variant gates measured: check.sh sources fabric-colima-lib.sh,
    # whose CTX defaults to the environment, so CTX=default made its context
    # gate refuse and three gates failed on the runner while passing on a Mac.
    # Reproduced locally with `CTX=default bash tests/check46-colima-*.sh`, and
    # refuted the platform explanation by running them green in an ubuntu:24.04
    # container. A per-step variable cannot do that to a step that ignores it.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # First and alone: the gates that need no fabric, no cluster and no
      # daemon. A logic regression fails here in seconds rather than after a
      # ten-minute bring-up.
      - name: Gates that need no lab
        run: bash tests/run-bgp-fabric-gates.sh

      # Demo 46's own surface, not every script in the repository. `tests/*.sh`
      # pulled in other demos' gates, so an unrelated warning (SC2063 in
      # tests/docs51-review-and-gap.sh) failed this workflow for a change that
      # had nothing to do with it. A workflow that fails on someone else's file
      # teaches people to ignore it.
      - name: Shellcheck
        run: |
          shellcheck -S warning \
            scripts/fabric-*.sh scripts/bgp-fabric-*.sh scripts/demo46-colima-e2e.sh \
            scripts/eg-net.sh \
            tests/*46*.sh tests/*55*.sh tests/fabric-*.sh tests/bgp-fabric-*.sh \
            tests/dashboard-*.sh tests/run-bgp-fabric-gates.sh \
            demos/55-bgp-fabric-desktop/*.sh demos/46-bgp-fabric-colima/*.sh

      # The pin, from a clean checkout: this is the first time in the run that
      # anything reaches the other repository, and it is the step that fails if
      # the pinned commit was force-pushed away.
      - name: The pinned bgp-fabric tree
        id: pin
        run: |
          set -euo pipefail
          dir=$(scripts/bgp-fabric-fetch.sh)
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          git -C "$dir" log -1 --format='%H %s'

      - name: The delegated unit suites
        run: |
          set -euo pipefail
          tests/fabric-dashboard-unit.sh
          tests/dashboard-ui-unit.sh

      # kind itself, at the version this repository pins. The cluster is then
      # built by OUR script from OUR config, not by a third-party action: a
      # cluster CI invented would not be the cluster anyone runs, and the first
      # version of this workflow proved the point — its single-node cluster put
      # the only node on 172.19.0.2, while clusters/eg-poc1.yaml is 1+1 and the
      # recorded run's second node is the 172.19.0.3 that demo 46 probes.
      - name: kind, at the pinned version
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . scripts/bootstrap/versions.env
          curl -fsSLo /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      # scripts/eg-net.sh and scripts/eg-up.sh are the same two commands a
      # person runs on a laptop — the node LAN with its reserved VIP range, the
      # cluster from clusters/eg-poc1.yaml, and the lab's own assertion that no
      # node landed outside 172.19.0.0/17.
      - name: The node LAN and the cluster, by our own scripts
        run: |
          set -euo pipefail
          scripts/eg-net.sh
          scripts/eg-up.sh eg-poc1

      - name: What is on the node LAN
        run: |
          docker network inspect kind-eg \
            --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}'
          kubectl --context kind-eg-poc1 get nodes -o wide

      # apply.sh calls fabric-up.sh, which PULLS the published images for the
      # pinned commit. That is the chain this workflow exists to prove: a
      # commit in bgp-fabric, an image its CI built and labelled with that
      # commit, and this lab running it.
      - name: Apply — the fabric, the tables, the events, the screenshots
        id: apply
        env:
          CHROME: /usr/bin/google-chrome
        run: demos/55-bgp-fabric-desktop/apply.sh

      - name: The running dashboard names the pinned commit
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . scripts/bgp-fabric.env
          got=$(curl -fsS --max-time 5 http://127.0.0.1:8088/api/version \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')
          [ "$got" = "$BGP_FABRIC_COMMIT" ] || {
            echo "the page says revision=$got, the pin says $BGP_FABRIC_COMMIT"; exit 1; }
          echo "/api/version revision=$got — the pin, the image and the page agree"

      # With nothing dialling in, the page reports `server sessions 0/0` — true,
      # and the least interesting truth it can tell. This makes both nodes peer
      # with both leaves through the listen range, so the run photographs a
      # fabric with something actually connected to it.
      - name: A server dials in — kube-vip over BGP on both leaves
        id: servers
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          FABRIC_DEMO_HERE=demos/55-bgp-fabric-desktop CTX_DOCKER= \
            FABRIC_PROJECT=bgp-fabric SERVERS_KUBE_CONTEXT=kind-eg-poc1 \
            FABRIC_NODE_LAN=kind-eg \
            FABRIC_LEAF1_LAN=172.19.254.11 FABRIC_LEAF2_LAN=172.19.254.12 \
            FABRIC_KUBEVIP_DS=demos/56-kube-vip-bgp/10b-kube-vip-ds-bgp-active-active.yaml \
            scripts/fabric-servers-join.sh
          # A second steady shot, now that the leaves have cluster sessions.
          export HERE=demos/55-bgp-fabric-desktop
          # shellcheck disable=SC1091
          . demos/shared/browser-shot.sh
          BROWSER_SHOT_PATH="$PWD/demos/55-bgp-fabric-desktop/output/screenshots/dashboard-servers-joined.png" \
          BROWSER_SHOT_URL="http://127.0.0.1:8088/?router=leaf1" \
          BROWSER_SHOT_WIDTH=1200 BROWSER_SHOT_HEIGHT=700 \
          BROWSER_SHOT_VIRTUAL_TIME_MS=4000 \
          BROWSER_SHOT_FILE_LABEL="demos/55-bgp-fabric-desktop/output/screenshots/dashboard-servers-joined.png" \
          browser_shot

      # The claim demo 46 could not previously make: a packet from the WAN
      # reaches a service address a cluster announced, four autonomous systems
      # away. Seven assertions in order, so a curl that worked while the route
      # was absent — the address reachable some other way — cannot pass.
      - name: Traffic — a packet crosses the fabric to an announced address
        id: traffic
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          FABRIC_DEMO_HERE=demos/55-bgp-fabric-desktop CTX_DOCKER= \
            FABRIC_PROJECT=bgp-fabric SERVERS_KUBE_CONTEXT=kind-eg-poc1 \
            FABRIC_VIP=10.98.0.46 FABRIC_LEAF1_LAN=172.19.254.11 \
            FABRIC_DASHBOARD_PORT=8088 \
            scripts/fabric-traffic.sh
          export HERE=demos/55-bgp-fabric-desktop
          # shellcheck disable=SC1091
          . demos/shared/browser-shot.sh
          BROWSER_SHOT_PATH="$PWD/demos/55-bgp-fabric-desktop/output/screenshots/dashboard-vip-routed.png" \
          BROWSER_SHOT_URL="http://127.0.0.1:8088/?router=spine" \
          BROWSER_SHOT_WIDTH=1200 BROWSER_SHOT_HEIGHT=700 \
          BROWSER_SHOT_VIRTUAL_TIME_MS=4000 \
          BROWSER_SHOT_FILE_LABEL="demos/55-bgp-fabric-desktop/output/screenshots/dashboard-vip-routed.png" \
          browser_shot

      - name: Check
        id: check
        run: |
          set -o pipefail
          mkdir -p demos/55-bgp-fabric-desktop/output
          demos/55-bgp-fabric-desktop/check.sh | tee demos/55-bgp-fabric-desktop/output/check.txt
          {
            echo "## demo 55 — check"
            echo
            echo '```'
            cat demos/55-bgp-fabric-desktop/output/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The gates that need the running fabric
        if: always() && steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          bash tests/fabric-agent-mgmt-input.sh
          bash tests/fabric-agent-allowlist.sh

      - name: Publish the screenshots to ci-captures
        if: always() && !cancelled()
        id: captures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT=demos/55-bgp-fabric-desktop/output/screenshots
          ls "$OUT"/*.png >/dev/null 2>&1 || {
            echo "no captures to publish" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "dir=" >> "$GITHUB_OUTPUT"; exit 0; }
          DIR="$(date -u +%Y-%m-%dT%H%MZ)_demo55_run${{ github.run_id }}-${{ github.run_attempt }}"
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git remote set-url origin "https://github.com/${REPO}.git"
          extra=(-c "http.extraheader=AUTHORIZATION: basic ${AUTH}")
          # Every run writes its OWN timestamped directory, so two runs that
          # finish together have no conflict to resolve — only a stale base.
          # Rebuild on the current tip and push again, with a jittered wait
          # because two runners retrying in lockstep collide again.
          publish_captures() {
            rm -rf .tmp/cap
            git worktree prune
            if git "${extra[@]}" ls-remote --exit-code --heads origin ci-captures >/dev/null 2>&1; then
              git "${extra[@]}" fetch -q origin ci-captures
              git branch -D ci-captures >/dev/null 2>&1 || true
              git worktree add --detach .tmp/cap origin/ci-captures || {
                echo "captures: could not create the .tmp/cap worktree" >&2; return 1; }
            else
              git worktree add -q --detach .tmp/cap
              (cd .tmp/cap && git checkout -q --orphan ci-captures && git rm -rfq . >/dev/null 2>&1 || true)
            fi
            mkdir -p ".tmp/cap/${DIR}"
            cp "$OUT"/*.png ".tmp/cap/${DIR}/"
            cp demos/55-bgp-fabric-desktop/output/check.txt ".tmp/cap/${DIR}/" 2>/dev/null || true
            (cd .tmp/cap && git add -A \
              && { git diff --cached --quiet && { echo "captures: nothing staged for ${DIR}" >&2; exit 1; } || true; } \
              && git commit -qm "captures: ${DIR}" \
              && git "${extra[@]}" push -q origin "HEAD:ci-captures")
          }
          pushed=no
          for attempt in 1 2 3 4 5; do
            if publish_captures; then pushed=yes; break; fi
            echo "captures push attempt ${attempt} lost the race; rebuilding on the current tip" >&2
            sleep $(( attempt * 3 + RANDOM % 5 ))
          done
          [ "$pushed" = yes ] || { echo "could not publish the captures after 5 attempts" >&2; exit 1; }
          {
            echo "## demo 55 — captures [\`${DIR}\`](https://github.com/${REPO}/tree/ci-captures/${DIR})"
            echo
            for f in "$OUT"/*.png; do
              n=$(basename "$f" .png)
              echo
              echo "### ${n}"
              echo
              echo "![${n}](https://raw.githubusercontent.com/${REPO}/ci-captures/${DIR}/${n}.png)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Router and dashboard logs
        if: always()
        run: |
          mkdir -p demos/55-bgp-fabric-desktop/output
          docker compose -p bgp-fabric \
            -f demos/55-bgp-fabric-desktop/fabric/compose.yaml \
            -f demos/55-bgp-fabric-desktop/fabric/compose.lan-eg.yaml \
            logs --no-color > demos/55-bgp-fabric-desktop/output/compose.log 2>&1 || true

      - name: Upload the run's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo55-ci
          path: demos/55-bgp-fabric-desktop/output/
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          demos/55-bgp-fabric-desktop/cleanup.sh || true
          kind delete cluster --name eg-poc1 || true
