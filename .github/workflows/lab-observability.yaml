# Enhancement 004, phases 1 and 2 — the observability lab on a GitHub-hosted runner: lab-route-b.yaml's clusters and
# mesh (set up complete and independent, the mesh available), then the monitoring stack laid on top from the demos'
# own files — demo 09's Gateway, 16 (kube-prometheus-stack, the Cilium and Hubble metrics, the dashboards), 21 (Tempo),
# 10/22/23 (the collector per cluster), 25 (Loki, hubble-observer from the operator's fork with cf2cnp and the verdicts
# dashboard, cf2cnp behind the Gateway), 18 (OBI) — then the sample applications demos 26–35 work on (and demo 11's
# forensic client, demo 20's petclinic), their traffic under audit, the cf2cnp chapters (the raw flows captured, the
# policies generated, validated three ways, applied, the applications re-tested), the enforced traffic, the demos' own
# checks as a report, and the pages captured with their expectations measured. Route A: demo 25's relay client
# certificate, the CLI's certificate and the Gateway's wildcard are cert-manager Certificates from the enterprise root
# (demos 08 and 24). The base shape (IPv4, veth, tunnel): the shape every one of those demos was captured on.
name: lab observability (kind) — demos 09/16/18/21/23/25, the labs of 26–35, the cf2cnp chapters, captures

on:
  workflow_dispatch:
    inputs:
      connectivity_test:
        description: run `cilium connectivity test --multi-cluster` at the end (about 15 minutes more)
        type: boolean
        default: false
      obi:
        description: demo 18 (OBI) on both clusters — eBPF instrumentation, the heaviest of the stacks
        type: boolean
        default: true
      audit_minutes:
        description: minutes of traffic under audit before the cf2cnp chapters generate from it (the observation window)
        type: number
        default: 3
      traffic_minutes:
        description: minutes of traffic once enforced, before the report and the captures (the dashboards' rate windows are 5 minutes)
        type: number
        default: 6
      springboot:
        description: demo 20's petclinic too — six Spring Boot services, about 2.4 GB of limits and 8 more minutes
        type: boolean
        default: true

permissions:
  contents: write   # the captures are pushed to the ci-captures branch so the job summary can show them (below)

jobs:
  two-clusters-meshed:
    runs-on: ubuntu-24.04
    # one job, the base shape: the demos were captured on IPv4, veth and the tunnel, and the stacks are the load here
    name: observability
    timeout-minutes: 150
    env:
      LAB_FEATURES: ""
      LAB_IPFAMILY: ipv4
      LAB_TRUST_ROOT: "1"   # the lab's enterprise root into the runner's OS trust store (update-ca-certificates), proven by a curl by name
    steps:
      - uses: actions/checkout@v5

      - name: The runner, bootstrapped — the tools at their pins, tcp_bbr, the preflight table
        # scripts/bootstrap/ubuntu.sh is the runner's whole preparation (enhancement 004): kind, kubectl, cilium-cli and
        # hubble from their releases at scripts/bootstrap/versions.env's pins with each published sha256 verified, the
        # pins exported into $GITHUB_ENV (lab-up.sh reads CILIUM_VERSION), BBR loaded (a module on Ubuntu; a kind node
        # shares the host kernel and cannot load it), then the same measured table a MacBook prints — netkit, Tetragon's
        # symbol, the node image for this CPU, IPv6 on a docker network. lab-up.sh runs the preflight again, strictly.
        # A Mac takes scripts/bootstrap/macos.sh to the same table; from there every host takes the same scripts.
        run: scripts/bootstrap/ubuntu.sh

      - name: Bring the lab up — poc1, poc2, meshed
        id: up
        run: |
          # pipefail: `lab-up.sh | tee` reported tee's exit status, and run 34789240547 went green past a Helm timeout
          set -o pipefail
          start=$(date +%s)
          # route A: the stack's certificates (the relay's mTLS client, the CLI's, the Gateway's wildcard) are cert-manager's
          scripts/lab-up.sh poc1 poc2 2>&1 | tee lab-up.log
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          # demo 36: lab-up.sh (LAB_TRUST_ROOT=1) put the lab's root into the runner's OS trust store; from here every check's
          # curl verifies against the OS bundle, not a file each script carries — the demos' scripts read ROOT_CA
          echo "ROOT_CA=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: What it cost
        run: |
          echo "lab-up took ${{ steps.up.outputs.seconds }} s"
          free -m; docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}'
          for ctx in kind-poc1 kind-poc2; do
            echo "-- $ctx"; kubectl --context $ctx get nodes -o wide; kubectl --context $ctx -n kube-system get pods -o wide | grep -E 'cilium|hubble|clustermesh'
            kubectl --context $ctx -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg status --brief
            kubectl --context $ctx -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg status --verbose | grep -E 'KubeProxyReplacement|ClusterMesh|Routing|Masquerading|Hubble|Device Mode|BIG TCP|BandwidthManager|IPv6|Encryption|Host firewall'
          done
          cilium clustermesh status --context kind-poc1; cilium clustermesh status --context kind-poc2
          for ctx in kind-poc1 kind-poc2; do kubectl --context $ctx -n kube-system get ds tetragon -o custom-columns='DS:.metadata.name,READY:.status.numberReady,WANT:.status.desiredNumberScheduled' --no-headers; done

      - name: A Gateway with an address from the pool, an L2-announced LoadBalancer, a global service
        run: |
          kubectl --context kind-poc1 apply -f demos/05-gateway-api/gateway.yaml
          for i in $(seq 1 30); do a=$(kubectl --context kind-poc1 get gateway -A -o jsonpath='{.items[0].status.addresses[0].value}' 2>/dev/null); [ -n "$a" ] && break; sleep 5; done
          echo "gateway address: ${a:-NONE}"; kubectl --context kind-poc1 get gateway -A
          [ -n "$a" ] || { echo "::error::the Gateway got no address from the pool"; exit 1; }
          kubectl --context kind-poc1 apply -f demos/07-clustermesh/global-service.yaml; kubectl --context kind-poc2 apply -f demos/07-clustermesh/global-service.yaml
          kubectl --context kind-poc1 apply -f demos/07-clustermesh/backend-poc1.yaml; kubectl --context kind-poc2 apply -f demos/07-clustermesh/backend-poc2.yaml
          kubectl --context kind-poc1 rollout status deploy/rebel-base --timeout=5m; kubectl --context kind-poc2 rollout status deploy/rebel-base --timeout=5m
          # the pool addresses reachable from the RUNNER (the host), and the demo names in /etc/hosts — SETUP Steps 3.5 and 8, measured
          scripts/lab-route.sh kind-poc1
          # every cluster's OWN block (NETWORKING_DESIGN §0): poc2 gets a LoadBalancer Service of its own, and its address —
          # from poc2's /26, not poc1's — is answered on the bridge and served, measured from the runner like poc1's.
          # TCP first (that is what makes the host ARP), then the neighbour table: an L2-announced address is answered
          # on ARP and served on its ports, but nothing owns it as an interface address, so ICMP goes unanswered —
          # run 34794243096 printed "NO ANSWER" for three addresses that all served HTTP 200.
          kubectl --context kind-poc2 expose deploy rebel-base --name rebel-base-lb --type LoadBalancer --port 80 --target-port 80
          for c in poc1 poc2; do
            echo "== $c: its pools, and every LoadBalancer address it holds (HTTP from the runner, then the ARP neighbour it learned)"
            kubectl --context "kind-$c" get ciliumloadbalancerippools -o custom-columns='POOL:.metadata.name,START:.spec.blocks[*].start,STOP:.spec.blocks[*].stop,CONFLICT:.status.conditions[?(@.type=="cilium.io/PoolConflict")].status' --no-headers
            for i in $(seq 1 24); do pending=$(kubectl --context "kind-$c" get svc -A -o json | jq '[.items[] | select(.spec.type=="LoadBalancer") | select((.status.loadBalancer.ingress // []) | length == 0)] | length'); [ "$pending" = 0 ] && break; sleep 5; done
            kubectl --context "kind-$c" get svc -A -o json | jq -r '.items[] | select(.spec.type=="LoadBalancer") | "\(.metadata.namespace)/\(.metadata.name) \(.status.loadBalancer.ingress[0].ip // "<pending>")"' | while read -r svc ip; do
              printf '  %-34s %-16s ' "$svc" "$ip"
              case "$ip" in \<pending\>) echo "NO ADDRESS"; continue;; esac
              code=$(curl -s -o /dev/null -m 8 --connect-timeout 3 -w '%{http_code}' "http://$ip/" || true)
              mac=$(ip neigh show to "$ip" | awk '{for (i = 1; i <= NF; i++) if ($i == "lladdr") print $(i+1)}' | head -1)
              if [ -n "$mac" ]; then l2="ARP answered by $mac"; else l2="NOT answered"; fi   # not ${mac:+…}${mac:-…}: both halves expand when set (review, N2)
              printf 'HTTP %-4s L2 %s\n' "${code:-000}" "$l2"
            done
          done
          kubectl --context kind-poc1 get svc rebel-base -o wide; kubectl --context kind-poc1 -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg service list | grep -B1 -A4 rebel | head -12
          kubectl --context kind-poc1 -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg service list | grep -i -A3 'rebel\|global' | head -20 || true

      # The lab's own images, built from their Containerfiles and loaded into both clusters before anything names them
      # (a kind node pulls from registries, not from the host's Docker): the operator's "build the images first" (2026-09-14)
      - name: The lab's images — built, loaded into every cluster
        run: |
          set -o pipefail
          scripts/lab-images.sh poc1 poc2 2>&1 | tee images.log

      # The stacks, from the demos' own files, in dependency order (scripts/lab-stack.sh's table), on the meshed lab
      - name: The observability stack — demos 09, 16, 21, 10/22/23, 25, 18, the CLI's certificate, demo 36's Kyverno
        run: |
          set -o pipefail
          steps="routes monitoring tempo collectors loki-observer"
          [ "${{ inputs.obi }}" = "true" ] && steps="$steps obi"
          steps="$steps hubble-cli kyverno"
          scripts/lab-stack.sh $steps 2>&1 | tee stack.log
          echo "== what it costs with the stacks up"; free -m | head -2; docker stats --no-stream --format '  {{.Name}} {{.CPUPerc}} {{.MemUsage}}'

      # The sample applications of demos 26–35 with one round of their traffic, demo 11's forensic client (what demo 15's
      # in-cluster check runs from) and demo 20's petclinic (its memory measured) — so every dashboard has flows to show
      - name: The labs of demos 26, 27, 30, 32, 35, the Star Wars app, the bank and the cell, the DNS-visibility policy, the forensic client, the petclinic, the labelled client
        run: |
          set -o pipefail
          [ "${{ inputs.springboot }}" = "true" ] || export LAB_APPS_SKIP=springboot
          scripts/lab-apps.sh all 2>&1 | tee apps.log

      # The observation window: the labs' own loops and the generators, round after round, under audit — the flows the
      # chapters generate from (the operator, 2026-09-15: "capturing of raw flow and using cf2cnp to generate …")
      - name: Traffic under audit for ${{ inputs.audit_minutes }} minutes — the observation the policies are generated from
        run: |
          set -o pipefail
          scripts/lab-apps.sh rounds ${{ inputs.audit_minutes }} 2>&1 | tee audit-traffic.log

      # The cf2cnp chapters (scripts/lab-policies.sh): per demo, the raw flows captured and kept, the policy generated
      # through cf2cnp's API, validated by the 0.7.0 binary, by the API server's dry run and by the agent's Valid condition,
      # applied, the audit flag dropped, the application tested again with the demo's own check — every promised line measured
      # A failed chapter or an empty store is recorded and the run goes on to the report and the captures — the evidence of
      # what state the lab was left in — and "The verdict" fails the job at the end (a failure here would otherwise skip them)
      - name: The cf2cnp chapters — demos 26, 27, 32, 30, 31, 35 — flows → policies, validated, applied, re-tested
        run: |
          set -o pipefail; mkdir -p .tmp
          scripts/lab-policies.sh all 2>&1 | tee policies.log || echo "the cf2cnp chapters (policies.log)" >> .tmp/failed-steps

      # a dashboard's rate windows need minutes of traffic, not one burst (the first captures had "No data" on the L7 and
      # DNS panels two minutes after a single round): every generator, round after round — now enforced (the 403s, the
      # drops) — then a wait until Prometheus, Loki and Tempo (traces from BOTH clusters) hold what the dashboards read,
      # each a failure when it stays empty
      - name: Traffic once enforced, ${{ inputs.traffic_minutes }} minutes, then the wait for the metrics, the logs and the traces from both clusters
        run: |
          set -o pipefail; mkdir -p .tmp
          scripts/lab-apps.sh traffic ${{ inputs.traffic_minutes }} 2>&1 | tee traffic.log || echo "the wait for the metrics, the logs and the traces (traffic.log)" >> .tmp/failed-steps

      # The demos' own checks after the traffic, as ONE report on the run page (above the captures) and in the artifact:
      # what was installed, what was exercised, what each chapter's check saw
      - name: The report — the demos' checks (16, 25 and its mTLS, 18, 23, 36, 15, 20, 19, the generated policies, 26, 30, 35), on the run page
        run: |
          mkdir -p captures
          TRAFFIC_MINUTES=${{ inputs.traffic_minutes }} scripts/lab-report.sh captures/report.md 2>&1 | tail -16
          cat captures/report.md >> "$GITHUB_STEP_SUMMARY"
          # the names the stack added (grafana, cf2cnp) into /etc/hosts and proven by name — lab-route.sh ran before the stack existed
          scripts/lab-route.sh kind-poc1 | tail -12

      # The pages, through the reusable browser action: Playwright pinned and cached on the runner, the pages a YAML spec
      # (scripts/capture/lab.yaml) with their expectations — every panel of the verdict dashboards has data but the ones
      # named with a reason, the Hubble UI shows the labs' traffic — a new endpoint is a new entry. The addresses come
      # from the cluster, the names resolve inside Chromium. The captures publish first; then a failed page fails the step.
      # the observer's own stdout for the last half hour — the raw flow lines the dashboards read from Loki — kept in the artifact so the
      # dashboard can be iterated without a cluster (demos/25-hubble-observer-loki/local-loop replays them into a local Loki)
      - name: The observer's flow lines, for the local loop
        run: |
          kubectl --context kind-poc1 -n hubble-observer logs deploy/hubble-observer -c hubble-observer --since=40m > captures/observer-flows.ndjson 2>/dev/null || true
          echo "observer lines kept: $(grep -c '"flow"' captures/observer-flows.ndjson || true)"

      - name: The addresses the pages live at
        id: addr
        run: |
          echo "gw=$(kubectl --context kind-poc1 -n routes get gateway routes-gw -o jsonpath='{.status.addresses[0].value}')" >> "$GITHUB_OUTPUT"
          echo "hubble=$(kubectl --context kind-poc1 -n kube-system get svc hubble-ui -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> "$GITHUB_OUTPUT"
      - name: Captures — Grafana's dashboards, the Hubble UI, cf2cnp; the pages' expectations
        uses: ./.github/actions/browser-walk
        with:
          spec: scripts/capture/lab.yaml
          out: captures
          env-json: '{"GW":"${{ steps.addr.outputs.gw }}","HUBBLE":"${{ steps.addr.outputs.hubble }}","GRAFANA_PASSWORD":"poc-grafana"}'

      # check-log-errors reads the agents' WHOLE log (no --log-check-only-test-time), so the bring-up's lines count too.
      # One exception: "Error initially creating lease lock … already exists" is client-go's leader election losing
      # the race to create an L2 announcement lease when both agents come back from a rollout restart — logged once,
      # level=error, on one agent of run 34794243096, the lease then acquired normally. The CLI's own exception list
      # carries the retrieve/update/release variants of the same race, not the create one.
      - name: Connectivity test, multi-cluster (Cilium's own)
        if: ${{ inputs.connectivity_test }}
        timeout-minutes: 45      # the step cannot hang the job: the fourth run sat here 23 minutes with no output; the
                                 # fifth spent 30 on DNS retries (fixed in lab-up.sh: CoreDNS upstreams)
        run: |
          # pipefail: the suite's exit code is the step's — run 34794243096 reported "1/87 tests failed" and both jobs were
          # green, because grep and sed were the last commands of the pipe (review of 004, N1)
          set -o pipefail
          start=$(date +%s)
          kubectl --context kind-poc1 get nodes -o custom-columns='NODE:.metadata.name,TAINTS:.spec.taints[*].key' --no-headers
          # streamed, not piped through tail: a hang must be visible in the log while it happens. --line-buffered, or grep
          # flushes in 4 KB blocks and the log's timestamps are the flushes, not the events (run 34794243096: eighteen
          # "Waiting for …" lines stamped 01:06:43, the next batch 01:11:26)
          cilium connectivity test --context kind-poc1 --multi-cluster kind-poc2 --test '!no-unexpected-packet-drops' \
            --collect-sysdump-on-failure --sysdump-output-filename 'cilium-sysdump-<ts>' \
            --log-check-extra-exceptions 'Error initially creating lease lock' 2>&1 | grep --line-buffered -v -E '^\s*$' | sed -u 's/^/  /'
          echo "connectivity test took $(( $(date +%s) - start )) s"

      - name: The verdict — every recorded failure, after the evidence is on the run page
        if: always()
        run: |
          if [ -s .tmp/failed-steps ]; then sed 's/^/::error::failed: /' .tmp/failed-steps; { echo; echo "## Failed"; sed 's/^/- /' .tmp/failed-steps; } >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "no recorded failures"

      - name: Sysdumps on failure
        if: failure()
        run: |
          cilium sysdump --context kind-poc1 --output-filename cilium-sysdump-poc1-final || true
          cilium sysdump --context kind-poc2 --output-filename cilium-sysdump-poc2-final || true

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-observability
          path: |
            lab-up.log
            images.log
            stack.log
            apps.log
            audit-traffic.log
            policies.log
            traffic.log
            captures/
            cilium-sysdump-*.zip
          if-no-files-found: ignore

      - name: Down
        if: always()
        run: scripts/lab-down.sh || true
