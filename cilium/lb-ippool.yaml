# LoadBalancer addresses for kind, carved out of the DOCKER NETWORK — in TWO pools.
#
# Apply with:
#   kubectl apply -f cilium/lb-ippool.yaml
#
# WHY TWO POOLS. A Gateway and a plain LoadBalancer Service are different things to operate: the
# Gateway range is what DNS points at (the wildcard *.poc.local resolves into it), what a firewall
# rule names, what a browser bookmark holds. Drawing Gateways and Services from one block means a
# Gateway's address is wherever allocation order happened to put it. Reserving a sub-range that
# ONLY Gateway-owned Services can draw from makes "the Gateway range" a property of the design,
# not of startup order.
#
# HOW THE SPLIT IS ENFORCED. Cilium labels every Service it generates for a Gateway with
# io.cilium.gateway/owning-gateway (verified on the live cluster; hubble-ui does not carry it).
# The two serviceSelectors are complementary on that key -- Exists vs DoesNotExist -- so every
# Service matches exactly one pool. That matters twice over: the docs do not define what happens
# when a Service matches several pools, and a pinned address (lbipam.cilium.io/ips) is only
# honoured inside a pool whose selector matches the Service.
#
# THE RANGES MUST NOT OVERLAP. From the LB IPAM docs: "The last added pool will be marked as
# Conflicting and no further allocation will happen from that pool." An earlier single pool was
# .200-.250; it is shrunk to .200-.239 in the SAME apply that adds .240-.250, so the two never
# overlap at any point.
#
# WHY THIS TOP SLICE OF 172.18.0.0/16. Docker's IPAM allocates container addresses from the
# bottom upward (.2, .3, ...), so a pool at the far top can never collide with a node. Confirm the
# subnet on your machine first: docker network inspect kind --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}'
#
# MACOS: these addresses are reachable from the host only with kernelForUDP and the host route
# (SETUP 2.3b and 3.5). That is a host/VM boundary; no in-cluster load balancer changes it.
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: kind-docker-pool          # the SERVICES pool (name kept stable to avoid re-allocation churn)
spec:
  blocks:
    - start: "172.18.255.200"
      stop: "172.18.255.239"      # 40 addresses for plain LoadBalancer Services (hubble-ui is .201)
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: DoesNotExist    # anything that is NOT a Gateway
---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-pool              # RESERVED FOR CILIUM GATEWAY API
spec:
  blocks:
    - start: "172.18.255.240"
      stop: "172.18.255.250"      # 11 addresses; *.poc.local resolves into this range
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: Exists          # only Services Cilium generated for a Gateway
---
# L2 ANNOUNCEMENTS: make the addresses above actually answerable (unchanged; covers both pools).
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: kind-l2-announce
spec:
  interfaces:
    - ^eth0$
  externalIPs: false
  loadBalancerIPs: true
