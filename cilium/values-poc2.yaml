# Cilium helm values for cluster poc2 — the ClusterMesh peer (1 control-plane + 1 worker).
#
# Installed by:
#   helm install cilium cilium/cilium --version 1.20.1 -n kube-system --kube-context kind-poc2 \
#     -f cilium/values-poc2.yaml \
#     --set k8sServiceHost=poc2-control-plane --set k8sServicePort=6443
#
# HOW THIS DIFFERS FROM poc1, and why each difference exists:
#
#  1. cluster.id / cluster.name MUST be unique across the mesh. poc1 is 1/poc1, this is 2/poc2.
#     The id is a number in 1-255 and it is baked into every security identity Cilium issues, so
#     changing it later is disruptive -- set it at install, which is why poc1 set its own on day one
#     even though the mesh came later.
#
#  2. k8sServiceHost is the CONTROL-PLANE NODE, not a load balancer. With a single control plane
#     kind creates no external load balancer container at all (verified: `docker ps` shows only
#     poc2-control-plane and poc2-worker). poc1 needed the load balancer because it has three
#     control planes and only that endpoint stays valid when one goes away.
#
#     SAME RULE AS poc1 THOUGH: pass the NAME, not the IP. The API server certificate lists
#     DNS:poc2-control-plane; it does not list every address the container might be given, and
#     Docker reassigns those on restart. See SETUP.md Step 5.3 for the failure this avoids.
#
#  3. No LB IPAM or L2 announcements. poc2 hosts no Gateway and no LoadBalancer Service; it exists
#     to be the far side of the mesh. Leaving them out keeps the cluster small on a laptop already
#     running poc1's five nodes.
cluster:
  name: poc2
  id: 2

ipam:
  mode: kubernetes

image:
  pullPolicy: IfNotPresent

operator:
  # One replica: this is a two-node cluster and the chart's default of 2 would leave one Pending.
  replicas: 1

# poc2 is also built with kubeProxyMode: none, so Cilium must do service load balancing here too.
kubeProxyReplacement: true

l7Proxy: true

hubble:
  enabled: true
  relay:
    # Relay on this side too, so `hubble observe` can be pointed at poc2 independently. The mesh
    # does not merge flow streams; each cluster keeps its own Hubble, which is worth knowing before
    # anyone goes looking for a single pane of glass.
    enabled: true
  ui:
    # No UI here -- poc1 has one, and a second would cost memory for a view nobody is watching.
    enabled: false
