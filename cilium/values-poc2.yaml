# Cilium helm values for cluster poc2 — the ClusterMesh peer (1 control-plane + 1 worker).
#
# Installed by:
#   helm install cilium cilium/cilium --version 1.20.1 -n kube-system --kube-context kind-poc2 \
#     -f cilium/values-poc2.yaml \
#     --set k8sServiceHost=poc2-control-plane --set k8sServicePort=6443
#
# HOW THIS DIFFERS FROM poc1, and why each difference exists:
#
#  1. cluster.id / cluster.name MUST be unique across the mesh. poc1 is 1/poc1, this is 2/poc2.
#     The id is a number in 1-255 and it is baked into every security identity Cilium issues, so
#     changing it later is disruptive -- set it at install, which is why poc1 set its own on day one
#     even though the mesh came later.
#
#  2. k8sServiceHost is the CONTROL-PLANE NODE, not a load balancer. With a single control plane
#     kind creates no external load balancer container at all (verified: `docker ps` shows only
#     poc2-control-plane and poc2-worker). poc1 needed the load balancer because it has three
#     control planes and only that endpoint stays valid when one goes away.
#
#     SAME RULE AS poc1 THOUGH: pass the NAME, not the IP. The API server certificate lists
#     DNS:poc2-control-plane; it does not list every address the container might be given, and
#     Docker reassigns those on restart. See SETUP.md Step 5.3 for the failure this avoids.
#
#  3. Its OWN LoadBalancer block, announced by its OWN L2 policy. A cluster is a complete system
#     before it is a mesh peer, and its service addresses are part of that: poc2 holds
#     172.18.255.128/26 of the reserved range (cilium/lb-ippool-poc2.yaml), poc1 holds .192/26 —
#     one layout, one block per cluster, so two clusters on one bridge never answer ARP for the same
#     address. (An earlier revision left LB IPAM and L2 off here "to keep the laptop small"; that made
#     poc2 an appendage of poc1, and a lab built for testing does the right thing.)
cluster:
  name: poc2
  id: 2

ipam:
  mode: kubernetes

image:
  pullPolicy: IfNotPresent

operator:
  # One replica: this is a two-node cluster and the chart's default of 2 would leave one Pending.
  replicas: 1

# poc2 is also built with kubeProxyMode: none, so Cilium must do service load balancing here too.
kubeProxyReplacement: true

# eBPF masquerading — and, with it, eBPF HOST ROUTING. The chart default is iptables masquerading,
# which forces `Host Routing: Legacy`: every packet leaving a pod still traverses the host stack and
# netfilter, and the datapath bypass the tuning guide describes is simply off. Demo 11 measured the
# difference on this VM: iperf3 pod-to-pod 9.1 -> 10.2 Gbit/s from this one value alone (tunnel mode,
# Hubble off in both runs), and `cilium status` flips from
#   Routing: Network: Tunnel [vxlan]  Host: Legacy      Masquerading: IPTables
# to
#   Routing: Network: Tunnel [vxlan]  Host: BPF         Masquerading: BPF [eth0]
# Nothing above it (policy, Gateway, ClusterMesh, LB IPAM) depends on iptables SNAT. It needs an
# agent restart, which takes the Gateway off the air for 2-3 minutes (gotcha #42) — apply it before
# anyone is watching. Docs: https://docs.cilium.io/en/stable/network/concepts/masquerading/
bpf:
  masquerade: true

l7Proxy: true

# LoadBalancer addresses without a cloud — poc2's own block (see 3. above). LB IPAM hands out
# addresses from cilium/lb-ippool-poc2.yaml; L2 announcements answer ARP for them on the bridge.
l2announcements:
  enabled: true
# L2 announcements lease-hammer the API server at default settings; the values Cilium's own docs
# suggest for small clusters (the same as poc1's).
k8sClientRateLimit:
  qps: 50
  burst: 100

hubble:
  enabled: true
  relay:
    # Relay on this side too, so `hubble observe` can be pointed at poc2 independently. The mesh
    # does not merge flow streams; each cluster keeps its own Hubble, which is worth knowing before
    # anyone goes looking for a single pane of glass.
    #   (Corrected by demo 24, 2026-09-12: once both clusters' Hubble certificates come from ONE CA, a relay
    #   does reach the other cluster's nodes through ClusterMesh — poc1's relay reports 7/7 nodes. The
    #   sentence above was true of the per-cluster cilium-ca install, gotcha #71.)
    enabled: true
    # Day one, not demo 25 (gotcha #75): the relay's server side on TLS with mutual authentication — see the
    # same block in values-poc1.yaml for the reasoning. Helm-method certificates at install, re-issued from
    # the enterprise root at Step 9.3a / demo 24.
    tls:
      server:
        enabled: true
        mtls: true
  ui:
    # No UI here -- poc1 has one, and a second would cost memory for a view nobody is watching.
    enabled: false
