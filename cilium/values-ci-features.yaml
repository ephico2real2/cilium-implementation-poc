# cilium/values-ci-features.yaml — the features the MacBook's Docker Desktop VM kernel (6.6.12-linuxkit) could not run,
# switched on together on a Linux runner (enhancement 004, phase 0, matrix entry `kernel-features`). Each one is
# diagnosed to its cause in demos/06-perf/README.md Part 4 and docs/TUNING.md; the runner's kernel (Ubuntu 24.04) is
# the first place this lab can measure them. Applied on top of the lab's values and values-ci.yaml by scripts/lab-up.sh
# when LAB_FEATURES is set.
bpf:
  datapathMode: netkit         # netkit devices instead of veth pairs — Cilium says kernel >= 6.8; the laptop has 6.6
bandwidthManager:
  enabled: true                # MEASURED OFF IN KIND ON ANY KERNEL (run 34785181164, kernel 6.17, tcp_bbr loaded): the agent
  bbr: true                    # says "BPF bandwidth manager could not read procfs … /host/proc/sys/net/core/default_qdisc".
                               # That sysctl lives in the host's network namespace only; a kind node is a container with its
                               # own, so the file is not there — the laptop's "seven sysctls in net/core" was this, not only the
                               # linuxkit kernel. Kept on so the status line keeps saying so; a VM-based node would show it on.
# BIG TCP is NOT here: the first spike run measured it — the agent refuses to start with "BIG TCP in tunneling mode
# requires pending kernel support" (run 34784194103, kernel 6.17.0-1022-azure). The lab runs VXLAN; BIG TCP needs
# native routing, and is a matrix entry of its own (native routing + autoDirectNodeRoutes) when the lab wants it.
ipv6:
  enabled: true                # dual-stack: the review of cf2cnp 0.7.0 fixed reserved:world-ipv4 / -ipv6 from Cilium's
                               # source because the IPv4-only laptop could not show them — here they can be captured
