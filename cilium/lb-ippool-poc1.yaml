# LoadBalancer addresses for poc1 — the cluster's OWN block of the docker network's reserved range, in TWO pools.
#
# Apply with:
#   kubectl --context kind-poc1 apply -f cilium/lb-ippool-poc1.yaml
#
# ONE BLOCK PER CLUSTER. A cluster is a complete system before it joins any mesh, and its service
# addresses are part of that. Every cluster on the `kind` bridge answers ARP for its LoadBalancer
# addresses on the SAME segment, and LB IPAM is a per-cluster allocator (one operator, one cluster;
# the LB IPAM docs describe no coordination between clusters) — so two clusters handed one pool
# file would allocate the same address twice and both would answer for it. The reserved range
# 172.18.255.0/24 is therefore subdivided, one /26 per cluster, the SAME layout inside each block
# (base+8 … base+47 for plain Services, base+48 … base+58 for Gateways; NETWORKING_DESIGN.md §0):
#
#   172.18.255.192/26   poc1     services .200–.239   gateways .240–.250   THIS FILE
#   172.18.255.128/26   poc2     services .136–.175   gateways .176–.186   cilium/lb-ippool-poc2.yaml
#   172.18.255.64/26    poc3     services .72–.111    gateways .112–.122   when a third cluster exists
#   172.18.255.0/26     shared   VIPs a pool in EVERY announcing cluster may hold (enhancement 002)
#
# Docker allocates container addresses only from 172.18.0.0/17 (scripts/lab-up.sh creates the
# network with --ip-range), so nothing else can ever land in 172.18.255.0/24.
#
# WHY TWO POOLS. A Gateway and a plain LoadBalancer Service are different things to operate: the
# Gateway range is what DNS points at (the wildcard *.poc.local resolves into it), what a firewall
# rule names, what a browser bookmark holds. Drawing Gateways and Services from one block means a
# Gateway's address is wherever allocation order happened to put it. Reserving a sub-range that
# ONLY Gateway-owned Services can draw from makes "the Gateway range" a property of the design,
# not of startup order.
#
# HOW THE SPLIT IS ENFORCED. Cilium labels every Service it generates for a Gateway with
# io.cilium.gateway/owning-gateway (verified on the live cluster; hubble-ui does not carry it).
# The two serviceSelectors are complementary on that key -- Exists vs DoesNotExist -- so every
# Service matches exactly one pool. That matters twice over: the docs do not define what happens
# when a Service matches several pools, and a pinned address (lbipam.cilium.io/ips) is only
# honoured inside a pool whose selector matches the Service.
#
# THE RANGES MUST NOT OVERLAP. From the LB IPAM docs: "The last added pool will be marked as
# Conflicting and no further allocation will happen from that pool." An earlier single pool was
# .200-.250; it is shrunk to .200-.239 in the SAME apply that adds .240-.250, so the two never
# overlap at any point.
#
# WHY THE TOP OF 172.18.0.0/16. Docker's IPAM allocates container addresses from the bottom
# upward (.2, .3, ...), so a block at the far top can never collide with a node even on a network
# kind created without --ip-range. Confirm the subnet on your machine first:
#   docker network inspect kind --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}'
#
# MACOS: these addresses are reachable from the host only with kernelForUDP and the host route
# (SETUP 2.3b and 3.5). That is a host/VM boundary; no in-cluster load balancer changes it.
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: kind-docker-pool          # the SERVICES pool (name kept stable to avoid re-allocation churn)
spec:
  blocks:
    - start: "172.18.255.200"
      stop: "172.18.255.239"      # 40 addresses for plain LoadBalancer Services (hubble-ui is .201)
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: DoesNotExist    # anything that is NOT a Gateway
---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-pool              # RESERVED FOR CILIUM GATEWAY API
spec:
  blocks:
    - start: "172.18.255.240"
      stop: "172.18.255.250"      # 11 addresses; *.poc.local resolves into this range
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: Exists          # only Services Cilium generated for a Gateway
---
# L2 ANNOUNCEMENTS: make the addresses above actually answerable (covers both of THIS cluster's
# pools). serviceSelector excludes shop-vip-gw: a CiliumL2AnnouncementPolicy selects SERVICES, not
# IPs, so without this NotIn both clusters' default policies would ARP for the shared VIP
# (172.18.255.16) the moment shop-vip-gw's Service existed — the conflict the split-Gateway design
# exists to avoid. The VIP is announced only by cilium/l2-shop-vip-announce.yaml, in one cluster.
# Editing this selector on a live cluster re-evaluates leases; apply.sh prints them before and after.
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: kind-l2-announce
spec:
  interfaces:
    - ^eth0$
  externalIPs: false
  loadBalancerIPs: true
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: NotIn
        values: [shop-vip-gw]             # NotIn still matches Services that lack the key (plain LBs, other Gateways)
