# Cilium for poc4 — the ztunnel exercise (demo 13). Day-1 values, as docs/TUNING.md Rule 0 says,
# plus ztunnel enabled AT INSTALL, which is how its docs describe it. cluster.id stays at the chart
# default 0 on purpose: ztunnel refuses any cluster whose id is non-zero (see clusters/poc4.yaml).
k8sServiceHost: poc4-control-plane     # single control plane: no external LB, the node's name (never its IP)
k8sServicePort: 6443
kubeProxyReplacement: true
l7Proxy: true
bpf:
  masquerade: true                      # eBPF host routing from day 1 (docs/TUNING.md §1)
hubble:
  enabled: true
  relay: {enabled: true}
  ui: {enabled: false}
encryption:
  enabled: true
  type: ztunnel                         # secret cilium-ztunnel-secrets must exist BEFORE install
  ztunnel:
    ca: {type: internal}                # Cilium's built-in CA — no SPIRE
