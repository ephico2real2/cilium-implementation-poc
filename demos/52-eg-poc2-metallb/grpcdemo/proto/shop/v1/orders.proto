syntax = "proto3";

package shop.v1;

option go_package = "grpcdemo/gen/shop/v1;shopv1";

// Orders is the shop catalogue over gRPC. The three rows match shop-db
// (keyboard 4999, mouse 1999, monitor 24900). Every response carries
// served_by (POD_NAME) and version (VERSION).
service Orders {
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc WatchOrders(WatchOrdersRequest) returns (stream OrderEvent);
  rpc SlowOrder(SlowOrderRequest) returns (Order);
}

message ListOrdersRequest {}

message ListOrdersResponse {
  repeated Order orders = 1;
  string served_by = 2;
  string version = 3;
}

message GetOrderRequest {
  int64 id = 1;
}

message Order {
  int64 id = 1;
  string item = 2;
  int64 amount_cents = 3;
  string served_by = 4;
  string version = 5;
}

message WatchOrdersRequest {
  int32 count = 1;
  int32 interval_ms = 2;
}

message OrderEvent {
  Order order = 1;
  string served_by = 2;
  string version = 3;
}

message SlowOrderRequest {
  int32 delay_ms = 1;
}
