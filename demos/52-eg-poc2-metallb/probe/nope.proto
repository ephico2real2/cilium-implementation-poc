// Descriptor for T8b: declares shop.v1.Nope/Do so grpcurl will send the RPC.
// This service is NOT served by grpcdemo — no GRPCRoute rule matches, Envoy
// answers 404, and grpcurl maps that to Unimplemented with an empty Message.
syntax = "proto3";

package shop.v1;

import "google/protobuf/empty.proto";

service Nope {
  rpc Do(google.protobuf.Empty) returns (google.protobuf.Empty);
}
