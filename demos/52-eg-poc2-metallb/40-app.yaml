# shopapi (demo 40 / 54). CLUSTER comes from ConfigMap/eg-cluster, written by
# apply.sh as name=eg-poc2. imagePullPolicy: Never — shopapi:local is
# kind-loaded (gotcha #118: no docker build for shopapi). The gRPC service
# is grpcdemo (41-grpcdemo.yaml), not routedemo. No Cilium policy: there is
# no Cilium on this cluster (R2).
#
#   kubectl --context kind-eg-poc2 apply -f demos/52-eg-poc2-metallb/40-app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopapi
  namespace: shop
  labels: {app.kubernetes.io/name: shopapi, app.kubernetes.io/part-of: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: shopapi}}
  template:
    metadata: {labels: {app: shopapi, app.kubernetes.io/name: shopapi, app.kubernetes.io/part-of: shop}}
    spec:
      containers:
        - name: shopapi
          image: shopapi:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          env:
            - name: CLUSTER
              valueFrom:
                configMapKeyRef: {name: eg-cluster, key: name}
            # main.go:56 reads DB_URL; the default points at the mesh lab's database
            - name: DB_URL
              value: postgres://shop:shop@shop-db.shop.svc.cluster.local:5432/shop?sslmode=disable
          livenessProbe:  {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {memory: 96Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: shopapi
  namespace: shop
  labels: {app.kubernetes.io/name: shopapi, app.kubernetes.io/part-of: shop}
spec:
  selector: {app: shopapi}
  ports: [{name: http, port: 80, targetPort: 8080}]
