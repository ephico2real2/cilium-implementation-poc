apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shop-frontend
  namespace: cf2cnp-lab27
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: cf2cnp
    app.kubernetes.io/name: shop
spec:
  description: Allow ingress traffic for the shop-frontend in cf2cnp-lab27 (2 rules merged from 2 observed flows)
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/name: shop
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: pos
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: stranger
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
