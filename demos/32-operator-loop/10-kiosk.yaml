# Demo 32 — a NEW client of the storefront, arriving after demo 27's policies were generated and enforced: the case
# every generated policy meets on day two. kiosk calls shop-frontend every 5 s; under demo 27's shop-frontend policy
# (pos only) it is dropped, and its flows are the input of `cf2cnp merge` (E5).
apiVersion: v1
kind: Pod
metadata: {name: kiosk, namespace: cf2cnp-lab27, labels: {app: kiosk, app.kubernetes.io/name: kiosk}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-frontend.cf2cnp-lab27/ >/dev/null 2>&1; sleep 5; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
