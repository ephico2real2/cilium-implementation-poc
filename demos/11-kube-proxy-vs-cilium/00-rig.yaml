# The measurement rig — IDENTICAL on both clusters, so the datapath is the only variable.
#
# Apply with:  kubectl --context kind-poc3 apply -f demos/11-kube-proxy-vs-cilium/00-rig.yaml
#              kubectl --context kind-poc1 apply -f demos/11-kube-proxy-vs-cilium/00-rig.yaml
#
# Layout (node names are the same on poc1 and poc3: <cluster>-worker / <cluster>-worker2, chosen
# with nodeSelector on the hostname LABEL's suffix via the affinity below):
#   web       3 replicas of the demo app (HTTP), on WORKER   -> the backends every generated Service points at
#   iperf3    server on WORKER                                 -> throughput target
#   client    nicolaka/netshoot on WORKER2                     -> curl, iperf3, GNU date (ns timestamps), nc
#   fortio    fortio on WORKER2                                -> HTTP load with connection churn (conntrack + per-connection cost)
#
# WHY netshoot FOR THE CLIENT. The programming-latency test needs a timestamp with sub-second
# precision INSIDE the pod (kubectl exec adds ~0.3 s of its own). busybox `date` has no %N; GNU
# coreutils does, and netshoot ships it together with curl, iperf3 and nc.
apiVersion: v1
kind: Namespace
metadata: {name: forensic}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: forensic}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [poc1-worker, poc3-worker, poc4-worker]}]}]}}}
      containers:
        - name: web
          image: routedemo:local
          imagePullPolicy: IfNotPresent
          args: ["-mode", "http", "-addr", ":8080"]
          env: [{name: APP_NAME, value: web}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: forensic}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata: {name: iperf3-server, namespace: forensic, labels: {app: iperf3-server}}
spec:
  affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [poc1-worker, poc3-worker, poc4-worker]}]}]}}}
  containers:
    - name: iperf3
      image: networkstatic/iperf3:latest
      args: ["-s"]
      ports: [{containerPort: 5201}]
---
apiVersion: v1
kind: Service
metadata: {name: iperf3-server, namespace: forensic}
spec:
  selector: {app: iperf3-server}
  ports: [{port: 5201, targetPort: 5201}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: forensic}
spec:
  affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [poc1-worker2, poc3-worker2, poc4-worker2]}]}]}}}
  containers:
    - name: client
      image: nicolaka/netshoot:v0.14
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata: {name: fortio, namespace: forensic}
spec:
  affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [poc1-worker2, poc3-worker2, poc4-worker2]}]}]}}}
  containers:
    - name: fortio
      image: fortio/fortio:1.69.5
      # The image has no shell and no `sleep`; its entrypoint IS fortio. Run the server so the pod
      # stays up, and drive load with `kubectl exec fortio -- fortio load …`.
      args: ["server"]
