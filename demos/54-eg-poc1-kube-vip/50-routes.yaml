# Two routes, two doors. HTTPRoute shop-api attaches only to http-gw; GRPCRoute
# grpc attaches only to grpc-gw. That is the isolation the operator asked for:
# no HTTPRoute on grpc-gw, no GRPCRoute on http-gw.
#
# shop-api covers both listeners of http-gw (http :80 and https :443). There is
# no redirect on :80 — the browser gets 200 over plain http.
#
# Method matches from demos/09-routes/03-routes.yaml: Health + both reflection
# services, so grpcurl list works with no .proto.
#
#   kubectl --context kind-eg-poc1 apply -f demos/54-eg-poc1-kube-vip/50-routes.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-api, namespace: shop}
spec:
  parentRefs:
    - {name: http-gw, sectionName: http}
    - {name: http-gw, sectionName: https}
  hostnames: ["api.eg-poc1.poc.local"]
  rules:
    - backendRefs: [{name: shopapi, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: {name: grpc, namespace: shop}
spec:
  parentRefs:
    - {name: grpc-gw, sectionName: h2c}
    - {name: grpc-gw, sectionName: https-grpc}
  hostnames: ["grpc.eg-poc1.poc.local"]
  rules:
    - matches:
        - method:
            service: grpc.health.v1.Health
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1alpha.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
