# shop is the app namespace AND the Gateway namespace. The Certificate Secret
# `eg-poc1-tls` lands here; the Gateways live here too, so Envoy Gateway can
# mount the Secret without a ReferenceGrant. Cleanup deletes the namespace.
#
#   kubectl --context kind-eg-poc1 apply -f demos/54-eg-poc1-kube-vip/00-namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
