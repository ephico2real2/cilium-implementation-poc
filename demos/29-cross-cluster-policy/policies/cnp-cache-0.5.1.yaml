apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cache-server
  namespace: mesh-lab
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: cf2cnp
    app.kubernetes.io/name: cache
spec:
  description: Allow ingress traffic from mesh-lab to mesh-lab for the cache
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: cache
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: batch
            app.kubernetes.io/name: worker
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
