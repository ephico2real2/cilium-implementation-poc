# demo46-probe — the smallest thing that can answer an HTTP request and say
# which pod answered it, published at 10.98.0.46 by kube-vip over BGP.
#
# Why this and not a Gateway: demos 51–56 put Envoy Gateway, certificates and
# an application behind their doors. Every one of those is another way for a
# reachability test to fail for a reason that is not demo 46's. The claim here
# is exactly one sentence — a packet from client0 crosses four autonomous
# systems and is answered — so the responder is busybox httpd on the alpine
# image the dashboard is already built on. No new image enters the lab's
# supply chain, and nothing is built (gotcha #118).
#
#   kubectl --context kind-eg-poc1 apply -f demos/46-bgp-fabric/probe/10-probe.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo46
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo46-probe
  namespace: demo46
spec:
  # One replica per node, so a reply names which node served it and ECMP has
  # somewhere to send either half.
  replicas: 2
  selector:
    matchLabels: { app: demo46-probe }
  template:
    metadata:
      labels: { app: demo46-probe }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: demo46-probe }
      containers:
        - name: httpd
          image: alpine:3.22
          # The body IS the evidence: it names the pod and the node, so a 200
          # proves which end answered rather than only that something did.
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              printf 'demo46-probe pod=%s node=%s\n' "$POD_NAME" "$NODE_NAME" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: demo46-probe
  namespace: demo46
  annotations:
    # The address is pinned, not allocated: it is the one the fabric's
    # prefix-list will accept from AS 65021 (EG-POC1-VIPS 10.98.0.0/26).
    kube-vip.io/loadbalancerIPs: "10.98.0.46"
spec:
  type: LoadBalancer
  # D11 — every Service that wants an address names its load balancer. kube-vip
  # runs class-only, so without this the Service stays <pending> for ever.
  loadBalancerClass: kube-vip.io/kube-vip-class
  # Cluster, not Local: the claim is reachability, and Local would additionally
  # require the announcing node to hold a ready pod. That is demo 56's
  # measurement, not this one's.
  externalTrafficPolicy: Cluster
  selector: { app: demo46-probe }
  ports:
    - name: http
      port: 80
      targetPort: 8080
