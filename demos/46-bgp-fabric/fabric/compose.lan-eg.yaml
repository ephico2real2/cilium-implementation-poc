# Overlay: attach the leaves to kind-eg at the network-devices block
# (enhancement 007 §3.1). The leaf frr.conf already carries
# `bgp listen range 172.19.0.0/17` and prefix-list EG-VIPS.
services:
  leaf1:
    networks:
      kind-eg:
        ipv4_address: 172.19.254.11
  leaf2:
    networks:
      kind-eg:
        ipv4_address: 172.19.254.12

networks:
  kind-eg:
    name: kind-eg
    external: true
