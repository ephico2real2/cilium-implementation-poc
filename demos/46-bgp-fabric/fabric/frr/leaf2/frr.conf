frr defaults traditional
hostname leaf2
log stdout
!
interface lo
 ip address 10.200.255.12/32
!
router bgp 65102
 bgp router-id 10.200.255.12
 neighbor 10.200.1.11 remote-as 65100
 neighbor 10.200.1.11 description spine
 neighbor 10.200.1.11 password ${FABRIC_BGP_PASSWORD}
 neighbor 10.200.1.11 timers 3 9
 neighbor 10.200.1.11 soft-reconfiguration inbound
 neighbor 10.200.1.11 route-map FABRIC-IN in
 neighbor 10.200.1.11 route-map LEAF-OUT out
 neighbor 10.200.1.11 maximum-prefix 256
 neighbor SERVERS peer-group
 neighbor SERVERS remote-as external
 neighbor SERVERS password ${FABRIC_BGP_PASSWORD}
 neighbor SERVERS soft-reconfiguration inbound
 neighbor SERVERS route-map SERVERS-IN in
 neighbor SERVERS route-map NOTHING out
 neighbor SERVERS maximum-prefix 64
 neighbor SERVERS timers 3 9
 neighbor SERVERS ttl-security hops 1
 bgp listen range 172.19.0.0/17 peer-group SERVERS
 bgp listen range 172.18.0.0/17 peer-group SERVERS
 bgp listen limit 16
 network 10.200.255.12/32
!
ip prefix-list COMPANY seq 10 permit 10.200.0.0/16 le 32
ip prefix-list EG-VIPS seq 10 permit 10.98.0.0/24 le 32
ip prefix-list CILIUM-VIPS seq 10 permit 10.99.0.0/24 le 32
!
route-map SERVERS-IN permit 10
 match ip address prefix-list EG-VIPS
route-map SERVERS-IN permit 20
 match ip address prefix-list CILIUM-VIPS
!
route-map NOTHING deny 10
!
route-map LEAF-OUT permit 10
 match ip address prefix-list COMPANY
route-map LEAF-OUT permit 20
 match ip address prefix-list EG-VIPS
route-map LEAF-OUT permit 30
 match ip address prefix-list CILIUM-VIPS
!
route-map FABRIC-IN permit 10
 match ip address prefix-list COMPANY
route-map FABRIC-IN permit 20
 match ip address prefix-list EG-VIPS
route-map FABRIC-IN permit 30
 match ip address prefix-list CILIUM-VIPS
!
