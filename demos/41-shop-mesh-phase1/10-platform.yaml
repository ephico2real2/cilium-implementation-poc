---
# ---- reviews + ratings
apiVersion: v1
kind: ConfigMap
metadata: {name: service-nginx, namespace: shop-reviews}
data:
  default.conf: |
    server {
      listen 80;
      location = /            { return 200 "$hostname\n"; }
      location = /healthz     { return 200 "ok\n"; }
      location = /ready       { return 200 "ok\n"; }
      location /latest        { return 200 "latest reviews\n"; }
      location /stars         { return 200 "4.7\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reviews, namespace: shop-reviews, labels: {app.kubernetes.io/name: reviews, app.kubernetes.io/part-of: shop}}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviews}}
  template:
    metadata: {labels: {app: reviews, app.kubernetes.io/name: reviews, app.kubernetes.io/part-of: shop}}
    spec:
      volumes: [{name: conf, configMap: {name: service-nginx}}]
      containers:
        - name: reviews
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
          livenessProbe:  {httpGet: {path: /healthz, port: 80}, initialDelaySeconds: 3, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /healthz, port: 80}, initialDelaySeconds: 2, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
        - name: caller                         # reviews are about catalog items
          image: alpine:3.20
          command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://catalog.shop-core/items >/dev/null 2>&1; sleep 8; done"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: shop-reviews
  annotations:
    service.cilium.io/global: "true"     # same name+namespace in both clusters: one service across the mesh
    service.cilium.io/affinity: local    # prefer healthy local backends; remote only when none are
spec: {selector: {app: reviews}, ports: [{port: 80, targetPort: 80}]}
---
# ratings is a caller-only Pod. R1 deliberately lists seven Kubernetes Services and does not
# include ratings: nothing calls ratings, and this container does not listen on a port.
apiVersion: v1
kind: Pod
metadata: {name: ratings, namespace: shop-reviews, labels: {app: ratings, app.kubernetes.io/name: ratings, app.kubernetes.io/part-of: shop}}
spec:
  containers:
    - name: client                             # ratings aggregates reviews (same namespace)
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://reviews.shop-reviews/stars >/dev/null 2>&1; sleep 6; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
# ---- the clients: the shopper goes through the gateway; the stranger goes straight to the catalog
apiVersion: v1
kind: Pod
metadata: {name: shopper, namespace: shop-clients, labels: {app: shopper, app.kubernetes.io/name: shopper}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do for p in catalog/items orders/place reviews/latest pay/charge; do wget -qO- --timeout=2 http://api-gateway.shop-edge/$p >/dev/null 2>&1; done; sleep 5; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: stranger, namespace: shop-clients, labels: {app: stranger, app.kubernetes.io/name: stranger}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://catalog.shop-core/items >/dev/null 2>&1; wget -qO- --timeout=2 http://payment-gateway.shop-payments/charge >/dev/null 2>&1; sleep 7; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
