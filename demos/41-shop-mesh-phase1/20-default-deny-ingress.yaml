# Demo 41 — one default-deny ingress per service namespace, applied while every service endpoint
# is in policy audit mode (audit-both.sh Enabled): every caller is reported as AUDIT, nobody is
# cut off, and the AUDIT flows are what cf2cnp turns into the allow rules. Copied from demo 35
# (do not modify demo 35's file). shop-clients gets no policy: it is a client namespace.
# Byte-identical in both clusters.
#   kubectl --context kind-poc1 apply -f demos/41-shop-mesh-phase1/20-default-deny-ingress.yaml
#   kubectl --context kind-poc2 apply -f demos/41-shop-mesh-phase1/20-default-deny-ingress.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: default-deny-ingress, namespace: shop-edge}
spec:
  description: default-deny ingress on every shop workload in shop-edge; audited first, enforced once the generated rules are in place
  endpointSelector: {matchLabels: {app.kubernetes.io/part-of: shop}}
  ingress:
    - {}
---
