# Grafana on the demo 09 Gateway as https://grafana.poc.local (the wildcard certificate covers it).
# The route lives in `routes` (with the Gateway); the ReferenceGrant is monitoring's consent (gotcha #32).
#   kubectl --context kind-poc1 apply -f demos/16-monitoring/10-gateway.yaml
#
# Two routes for one hostname, the Gateway API's own pattern for "TLS only": the serving route attaches to the HTTPS
# listener alone (sectionName), and a second route on the HTTP listener answers every plain-HTTP request with a 301 to
# https://. Before this (2026-09-16) the serving route had no sectionName, so it attached to BOTH listeners and Grafana
# was served on :80 too — a browser at http://grafana.poc.local then sent Origin: http://grafana.poc.local to cf2cnp,
# which allows https://grafana.poc.local only (demo 33), the preflight failed and the dashboard's Generate action died
# in the browser with "An error has occurred" (issue #14). The redirect gives the lab one Grafana origin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: grafana, namespace: routes}
spec:
  parentRefs: [{name: routes-gw, sectionName: https-wildcard}]   # the HTTPS listener only
  hostnames: ["grafana.poc.local"]
  rules:
    - backendRefs: [{name: monitoring-grafana, namespace: monitoring, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: grafana-redirect, namespace: routes}
spec:
  parentRefs: [{name: routes-gw, sectionName: http}]             # the HTTP listener only
  hostnames: ["grafana.poc.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}      # port follows the scheme (443); path and query are kept
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: allow-routes-to-grafana, namespace: monitoring}
spec:
  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: routes}]
  to: [{group: "", kind: Service, name: monitoring-grafana}]
