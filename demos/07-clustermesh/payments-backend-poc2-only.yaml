# The provider. Applied to poc2 ONLY — poc1 never runs this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 2
  selector:
    matchLabels: {name: payments}
  template:
    metadata:
      labels: {name: payments}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
      volumes:
        - name: html
          configMap: {name: payments-response}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-response
data:
  index.html: |
    {"service": "payments", "running_in": "poc2", "note": "this provider exists ONLY in poc2"}
