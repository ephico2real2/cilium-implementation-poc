# Model A: team-a owns the HTTPRoute; the label on the namespace is the platform's consent to attach to routes-gw.
# No ReferenceGrant: the route and Service shop share the namespace. Serving route on https-wildcard, 301 on http.
#
#   kubectl --context kind-poc1 apply -f demos/37-two-gateways/20-shared-route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop, namespace: team-a}
spec:
  parentRefs: [{name: routes-gw, namespace: routes, sectionName: https-wildcard}]
  hostnames: ["shop-a.poc.local"]
  rules:
    - backendRefs: [{name: shop, port: 8080}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier: {set: [{name: X-Door, value: routes-gw}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-redirect, namespace: team-a}
spec:
  parentRefs: [{name: routes-gw, namespace: routes, sectionName: http}]
  hostnames: ["shop-a.poc.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
