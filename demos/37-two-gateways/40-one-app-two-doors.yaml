# Literally one backend behind both doors: team-b-gw routes shop-a.team-b.poc.local at team-a's Service shop
# (the ReferenceGrant in team-a is the consent). The JSON's app field is shop-a either way; X-Door says which
# door answered.
#
#   kubectl --context kind-poc1 apply -f demos/37-two-gateways/40-one-app-two-doors.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-a-via-team-b, namespace: team-b}
spec:
  parentRefs: [{name: team-b-gw, sectionName: https}]
  hostnames: ["shop-a.team-b.poc.local"]
  rules:
    - backendRefs: [{name: shop, namespace: team-a, port: 8080}]   # cross-namespace; needs the grant below
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier: {set: [{name: X-Door, value: team-b-gw}]}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: allow-team-b-to-shop, namespace: team-a}     # TARGET namespace; granted by its owner
spec:
  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: team-b}]
  to: [{group: "", kind: Service, name: shop}]
