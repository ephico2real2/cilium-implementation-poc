# Demo 36 Part 3 — the mount without asking: Kyverno (v1.19.1) mutates every pod that carries the label
# trust.poc.local/root=enterprise so that it gets the trust bundle the way demo 11's client declares it by hand —
# the ConfigMap trust-manager keeps in every namespace mounted at /etc/enterprise-root — and the variables the runtime
# families read, in EVERY container: SSL_CERT_FILE (the OpenSSL convention), CURL_CA_BUNDLE (curl reads it FIRST — the
# official curl image pins it to its own /cacert.pem, so SSL_CERT_FILE alone left the pod at ssl_verify_result 20 in
# run 34937306210), REQUESTS_CA_BUNDLE (Python requests), NODE_EXTRA_CA_CERTS (Node). The file is a complete bundle
# (20-bundle.yaml: the public roots plus ours), so pointing a runtime at it takes nothing away. A
# MutatingPolicy (policies.kyverno.io/v1, the CEL policy type — the same language as Kubernetes' own
# MutatingAdmissionPolicy): the match is a label selector, the mutation is an apply configuration (server-side-apply
# merge: the volume by name, each container by name, so a pod that already mounts something keeps it).
#   kubectl --context kind-poc1 apply -f demos/36-trust-everywhere/40-kyverno-mutatingpolicy.yaml
#   kubectl --context kind-poc1 get mutatingpolicy mount-enterprise-root
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mount-enterprise-root
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    objectSelector:
      matchLabels:
        trust.poc.local/root: enterprise
  failurePolicy: Fail                  # a labelled pod that cannot be mutated must not start unmounted, silently
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "enterprise-root",
                  configMap: Object.spec.volumes.configMap{name: "enterprise-root"}
                }
              ],
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                volumeMounts: [
                  Object.spec.containers.volumeMounts{name: "enterprise-root", mountPath: "/etc/enterprise-root", readOnly: true}
                ],
                env: [
                  Object.spec.containers.env{name: "SSL_CERT_FILE", value: "/etc/enterprise-root/ca.crt"},
                  Object.spec.containers.env{name: "CURL_CA_BUNDLE", value: "/etc/enterprise-root/ca.crt"},
                  Object.spec.containers.env{name: "REQUESTS_CA_BUNDLE", value: "/etc/enterprise-root/ca.crt"},
                  Object.spec.containers.env{name: "NODE_EXTRA_CA_CERTS", value: "/etc/enterprise-root/ca.crt"}
                ]
              })
            }
          }
