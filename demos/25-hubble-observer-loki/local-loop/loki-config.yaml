# Loki single binary, filesystem storage, no auth — a laptop loop, nothing else
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage: {filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}}
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  reject_old_samples: false          # the replay writes lines stamped over the last half hour
  allow_structured_metadata: true
