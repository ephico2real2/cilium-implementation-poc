apiVersion: v2
name: hubble-observer
description: A Helm chart for Hubble Observer - A small observability component that monitors network flows within Cilium.
type: application
version: 2.6.0-alpha
appVersion: "1.16.4"
keywords:
  - networking
  - observability
  - security
  - cilium
  - hubble
  - kubernetes
  - hubble-observer
sources:
  - https://github.com/onzack/hubble-observer
maintainers:
  - name: ONZACK
    url: https://onzack.com
dependencies:
  # cf2cnp from the fork's Helm repository (GitHub Pages) while onzack/cf2cnp#3 is pending: 0.5.0 builds download_url from
  # the proxy headers (or externalURL), accepts many flows per request merged per workload, names policies after the whole
  # selector, carries the selector's labels. Upstream: oci://ghcr.io/onzack/helm-charts, version "*".
  - name: cf2cnp
    version: "0.5.0"
    repository: https://ephico2real2.github.io/cf2cnp
    condition: cf2cnp.enabled
