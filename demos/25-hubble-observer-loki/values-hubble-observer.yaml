# Demo 25 — our values for onzack/hubble-observer, written FROM default-values/hubble-observer-2.6.0-alpha.yaml (chart-prep.sh).
# The chart installed is the vendored copy at chart/hubble-observer (git main, commit in chart/UPSTREAM-COMMIT.txt, also
# published as OCI tag 2.6.0-alpha): the published 2.5.0's three probes dial the relay's SHORT name and kill a working
# container every minute outside kube-system (README Part 2). Keys equal to the default are restated where a reader
# would look for them and marked "(default)"; every other key states what it changes and why.
# The observer is one pod running
#   hubble observe flows --verdict DROPPED --follow --ip-translation --server hubble-relay.kube-system.svc.cluster.local:80 -o json
# against poc1's relay, one JSON flow per line on stdout. Installed in poc1 ONLY: since demo 24 poc1's relay streams all 7
# nodes of the mesh and every flow carries source.cluster_name / destination.cluster_name.
#   helm install hubble-observer demos/25-hubble-observer-loki/chart/hubble-observer \
#     -n hubble-observer --create-namespace --kube-context kind-poc1 -f demos/25-hubble-observer-loki/values-hubble-observer.yaml
image:                                   # Part 7d (2026-09-12) — NOT the chart default. The default, quay.io/cilium/hubble:v1.16.4, is the
  repository: quay.io/cilium/cilium      # last image that registry ever published (pushed 2024-11-21; Go 1.23; alpine 3.20.3; trivy: 2
  tag: "v1.20.1@sha256:ae9ea21f7427fe24bc6ea7247eb552157a1b0a431744045d3f641545ca71d11b"   # CRITICAL + 19 HIGH in the OS layer, 35 in the binary at scan time). Unmaintained means no
                                         # security fixes, ever. The Hubble CLI that IS maintained ships inside the Cilium agent image,
                                         # on the same release train as the relay it talks to — so the observer runs the cluster's own
                                         # Cilium version, pinned by digest like the agents (demo 01), and moves when Cilium moves.
                                         # Cost: a ~600 MB image already present on every node (it is the agent's), so no extra pull.
verdictFilter: DROPPED                   # (default) the dashboard's purpose; `none` streams every flow (≈5,000 lines/min here)
excludeUnsupportedL3Protocols: true      # (default) drops with reason UNSUPPORTED_L3_PROTOCOL are noise
fieldMask:                               # default [] (full flows). Part 9: `hubble observe --field-mask` — the relay removes every
  - time                                 # other field before sending, so the stream, the pod log and Loki shrink. This is the
  - uuid                                 # smallest mask that still feeds every panel of the 23862 dashboard (its 40 flow_* labels,
  - verdict                              # the destination_names[0] path, the labels-based Source/Destination naming, the two
  - drop_reason                          # extended panels): measured 1330 → 964 bytes per DROPPED flow (−27%). Dropped: ethernet,
  - drop_reason_desc                     # event_type, emitter, file, node_labels, policy_log, policy_match_type, source/destination.ID,
  - traffic_direction                    # workloads — none of which any panel reads.
  - node_name
  - Type
  - Summary
  - IP
  - l4
  - l7
  - source.namespace
  - source.pod_name
  - source.labels
  - source.identity
  - source.cluster_name
  - destination.namespace
  - destination.pod_name
  - destination.labels
  - destination.identity
  - destination.cluster_name
  - destination_names
  - egress_denied_by
  - ingress_denied_by
hubbleRelay:
  serviceName: hubble-relay              # (default)
  namespace: kube-system                 # (default)
  port: "443"                            # default "" (→ 443 with TLS): the relay Service moved 80 → 443 in Part 5c
  tls:
    enabled: true                        # default false. Part 5: the relay requires TLS and a client certificate (mTLS);
    serverName: hubble.hubble-relay.cilium.io   # (default) the relay's certificate is *.hubble-relay.cilium.io
    ca: {secretName: hubble-observer-relay-certs}            # ca.crt = the enterprise root (cert-manager wrote it)
    client: {enabled: true, secretName: hubble-observer-relay-certs}   # tls.crt/tls.key: the observer's OWN client cert,
                                         # issued by ClusterIssuer/ca-issuer (30-relay-mtls-client-cert.yaml) — no secret copied
resources:                               # not in defaults (unbounded): bounded for the VM
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
grafanaDashboard:
  enabled: false                         # default true: it is a GrafanaDashboard CR for the Grafana OPERATOR, which this stack does
                                         # not run; the same JSON is provisioned as a ConfigMap for the demo 16 sidecar (dashboard-from-file.sh)
ciliumNetworkPolicy:
  enabled: true                          # default false. ON since Part 8: the chart's policy never worked upstream (no DNS rule,
                                         # and the Service port where Cilium enforces the pod port — issue #8); the vendored chart
                                         # carries PR #9, whose defaults (dns.enabled: true, kube-dns in kube-system, relayPort 4245)
                                         # are validated live in Part 8: policy on, 0 drops from the observer, 7/7 nodes.
  cf2cnp:                                # demo 33, E6 — the chart's default [cluster, world] admits every pod in the cluster (and the world) to
    ingressFromEntities: [ingress, host] # cf2cnp: narrowed to the Gateway and the kubelet, the same peers the subchart's policy names. Measured:
                                         # a lab pod reached /generate directly until this changed (gotcha #88).
cf2cnp:                                  # the README's "Configuration" section: CF2CNP turns observed flows into CiliumNetworkPolicies
  enabled: true                          # default false: on — the dashboard links to it (POST /generate + a small UI). Subchart 0.4.0,
                                         # image ghcr.io/onzack/cf2cnp:0.3.1, defaults in default-values/cf2cnp-0.4.0.yaml
  resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}   # not in defaults: bounded
  image:                                 # demo 26 Part 14/14e, demo 28 (2026-09-13) — NOT the chart default (ghcr.io/onzack/cf2cnp). The fork's
    repository: ghcr.io/ephico2real2/cf2cnp   # release 0.5.0 (ephico2real2/cf2cnp, tag v0.5.0; upstream PR onzack/cf2cnp#3 pending):
    tag: "0.9.0"                         # (0.5.1: the page summary names components; 0.6.0, demo 29–33: enhancement 001 — cluster-aware selectors,
                                         # L7 rules, the DNS-visibility rule, exclude=, `cf2cnp merge`, allowed origins + token + a policy for the pod,
                                         # release binaries; 0.6.1, demo 32: merge keeps the file as it was, one kube-dns rule; 0.6.3, demo 35: the
                                         # description written from the rules; 0.7.0: Cilium's own policy types; 0.8.0 (2026-09-16): the
                                         # API page as a Swagger-like surface — version badge, Try-it-out under each endpoint, the two review
                                         # passes' fixes, fork PR #3; 0.9.0: structured logging — one line per
                                         # request with a request id, every refusal with its reason, the download's 404/410/200, fork PR #6) download_url from
                                         # the proxy headers, many flows per request merged per workload, policy
    pullPolicy: IfNotPresent             # names a function of the whole selector, labels on every policy, ?name=, body cap, the
                                         # page's summary/copy/download. The chart itself comes from https://ephico2real2.github.io/cf2cnp
                                         # (the hubble-observer fork's dependency). The nodes pull the image from ghcr themselves — the
                                         # package is public (the pod's imageID is a ghcr digest); no `kind load` for it (gotcha #113).
  cors:                                  # demo 33 (2026-09-13), E6 — default []: any Origin was echoed as `*`. Only the Grafana origin may
    allowedOrigins: [https://grafana.poc.local]   # call /generate from a browser (the dashboard action); a curl with another Origin gets no
                                         # Access-Control-Allow-Origin at all (measured, Part 2). Non-browser clients are unaffected.
  networkPolicy:                         # demo 33, E6 — default false: the subchart's own CiliumNetworkPolicy for the cf2cnp pod: ingress from
    enabled: true                        # the Gateway (reserved:ingress) and the kubelet's probes (reserved:host) on 8080, egress to kube-dns.
                                         # fromEndpoints stays [] — the Grafana action arrives through the Gateway. NOTE: this policy alone
                                         # changed nothing while the parent chart's ciliumNetworkPolicy.cf2cnp.ingressFromEntities was
                                         # [cluster, world] (measured, Part 2): policies add, they never narrow — see the parent's value below.
  ingress: {enabled: false}              # (default) no Ingress controller here
  httpRoute:
    enabled: false                       # (default) our Gateway (demo 09) admits HTTPRoutes from its OWN namespace only
                                         # (allowedRoutes: Same), so the route lives in `routes` with a ReferenceGrant here:
                                         # 20-cf2cnp-route.yaml, hostname cf2cnp.poc.local. The dashboard's CF2CNP URL is set by
                                         # dashboard-from-file.sh (the chart would have taken it from httpRoute.hostnames[0]).

policyVerdictsDashboard:                 # demo 28 (2026-09-13) — NOT in the upstream chart: the Hubble / Policy Verdicts (Namespace)
  enabled: true                          # dashboard (born in demo 26) as its own chart, https://github.com/ephico2real2/hubble-policy-verdicts,
  dashboard: {folder: Hubble}            # a dependency of the hubble-observer fork (alias policyVerdictsDashboard). Sidecar ConfigMap in the
  sidecar: {namespace: monitoring}       # monitoring namespace, next to the chart's own dashboards; the operator CR stays off (no operator here).
  lokiRow:                               # demo 34 (2026-09-13) — chart 0.2.0: the optional Loki flow row under the verdict panels, so a verdict
    enabled: true                        # becomes a policy on ONE dashboard: the flow table (uid links to the observer dashboard, the cf2cnp
    cf2cnpURL: https://cf2cnp.poc.local  # Generate action posting the flow's JSON line) reads the observer's Loki stream by namespace label.
    observerNamespace: hubble-observer   # the label the demo 10 collector stamps on the observer's log lines (resource/loki-labels)
