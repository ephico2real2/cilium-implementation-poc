# The routes: three kinds, attaching to the listeners in 01-gateway.yaml. Apply with:
#   kubectl apply -f demos/09-routes/03-routes.yaml
#
# HOW A ROUTE PICKS A LISTENER. A route names the Gateway in parentRefs, and the Gateway attaches
# it to every listener whose protocol AND hostname are compatible. So an HTTPRoute for
# web.poc.local lands on https-wildcard (because *.poc.local covers it) AND on http (no hostname,
# matches all) -- which is why the same URL works over both https:// and http:// below.
---
# HTTPRoute 1 — a specific subdomain under the wildcard
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: web, namespace: routes}
spec:
  parentRefs: [{name: routes-gw}]
  hostnames: ["web.poc.local"]
  rules:
    - backendRefs: [{name: web, port: 8080}]
---
# HTTPRoute 2 — a DIFFERENT subdomain under the same wildcard, same backend. Its only job is to
# prove the wildcard certificate covers a name nobody configured a certificate for.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: anything, namespace: routes}
spec:
  parentRefs: [{name: routes-gw}]
  hostnames: ["anything-at-all.poc.local"]
  rules:
    - backendRefs: [{name: web, port: 8080}]
---
# HTTPRoute 3 — the NON-wildcard host, served by the exact-name certificate
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: exact, namespace: routes}
spec:
  parentRefs: [{name: routes-gw}]
  hostnames: ["exact.example.test"]
  rules:
    - backendRefs: [{name: web, port: 8080}]
---
# GRPCRoute — matches on the gRPC service name, which is a thing HTTPRoute cannot express.
# grpc.health.v1.Health is the standard health service the app registers.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: {name: grpc, namespace: routes}
spec:
  parentRefs: [{name: routes-gw}]
  hostnames: ["grpc.poc.local"]
  rules:
    - matches:
        - method:
            service: grpc.health.v1.Health
      backendRefs: [{name: grpc, port: 9090}]
    # Reflection, so grpcurl can list services without a .proto file
    - matches:
        - method:
            service: grpc.reflection.v1alpha.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
---
# TCPRoute — no hostnames, no paths, no methods: it binds to the listener by NAME (sectionName)
# because a TCP listener has nothing else to match on. Experimental-channel CRD; v1 is its storage
# version in Gateway API 1.6.1 (v1alpha2 is served but deprecated).
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata: {name: echo, namespace: routes}
spec:
  parentRefs:
    - name: routes-gw
      sectionName: tcp-echo
  rules:
    - backendRefs: [{name: echo, port: 7000}]
