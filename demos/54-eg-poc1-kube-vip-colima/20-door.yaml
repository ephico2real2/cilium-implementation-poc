# The door — a LoadBalancer Service on the kube-vip class with a pin
# in EG-POC1-VIPS (10.198.0.0/26). Envoy Gateway is not here: this demo
# is the cluster talking to the fabric, not the HTTP/gRPC product.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: door
  namespace: door
spec:
  replicas: 1
  selector:
    matchLabels:
      app: door
  template:
    metadata:
      labels:
        app: door
    spec:
      containers:
        - name: nginx
          image: localhost:5001/door:local
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: door
  namespace: door
  annotations:
    kube-vip.io/loadbalancerIPs: "10.198.0.10"
spec:
  type: LoadBalancer
  loadBalancerClass: kube-vip.io/kube-vip-class
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: door
