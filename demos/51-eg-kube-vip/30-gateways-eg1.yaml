# eg1's two doors. Two Gateways, not one (demo 40's choice): address and hostname
# differ, and the VIP must exist in ONE cluster at a time — kube-vip announces
# whatever Service carries the annotation, so a combined Gateway or a VIP Gateway
# in both clusters would put two ARP responders on .16.
#
# EnvoyProxy FIRST (same file, before the Gateway). Phase 0 measured: the class is
# immutable on the generated Service — attach later and EG logs
# `spec.loadBalancerClass: may not change once set`. Recreate, never patch.
#
# WHY BOTH spec.addresses AND the EnvoyProxy annotation. Phase 0 (R7):
#   spec.addresses alone → Service.externalIPs, status.loadBalancer empty, 0 ARP replies.
#   EnvoyProxy.envoyService (class + kube-vip.io/loadbalancerIPs) → one ARP responder.
#   Combined at create time with matching IPs: Accepted + Programmed, status.addresses
#   stays spec.addresses (EG docs: if set, those are the only status addresses), and
#   kube-vip announces. Both are set so the Gateway status is honest AND the wire
#   answers.
#
# D11: every door names its load balancer. kube-vip runs class-only; a class-less
# Service stays <pending> (15-probe-noclass.yaml).
#
# apply.sh creates eg-vip-gw in VIP_HOME only (default eg1). The objects are in this
# file so a junior reads the complete picture; apply.sh / eg-vip-move.sh apply the
# VIP pair to one cluster at a time.
#
#   kubectl --context kind-eg1 apply -f demos/51-eg-kube-vip/30-gateways-eg1.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg1-gw-proxy
  namespace: shop
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: kube-vip.io/kube-vip-class
        annotations:
          kube-vip.io/loadbalancerIPs: "172.19.255.240"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg1-gw
  namespace: shop
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eg1-gw-proxy
  addresses:
    - type: IPAddress
      value: "172.19.255.240"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: api.eg1.poc.local
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-grpc
      protocol: HTTPS
      port: 443
      hostname: grpc.eg1.poc.local
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-vip-gw-proxy
  namespace: shop
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: kube-vip.io/kube-vip-class
        annotations:
          kube-vip.io/loadbalancerIPs: "172.19.255.16"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-vip-gw
  namespace: shop
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eg-vip-gw-proxy
  addresses:
    - type: IPAddress
      value: "172.19.255.16"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: api.eg.poc.local
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-grpc
      protocol: HTTPS
      port: 443
      hostname: grpc.eg.poc.local
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
