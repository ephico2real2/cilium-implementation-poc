# kube-vip cloud-provider ranges for eg1 (enhancement 007 §3.1).
# RBAC + DaemonSet + cloud-provider are the phase 0 files — one source of truth:
#   clusters/eg/kube-vip-rbac.yaml
#   clusters/eg/kube-vip-ds.yaml          (v1.2.4, ARP, svc_election, lb_class_only, no taint)
#   clusters/eg/kube-vip-cloud-provider.yaml  (v0.0.12, KUBEVIP_ENABLE_LOADBALANCERCLASS=true)
# This file is the per-cluster ConfigMap; clusters/eg/kubevip-configmap.yaml is phase 0's
# eg1 record and is not applied here.
#
# range-envoy-gateway-system: Envoy Gateway writes the door Services in that namespace.
# range-default: ordinary Services (phase 0's probe). .16 is pinned by annotation and
# sits outside these ranges on purpose (kube-vip: "even outside of the assigned ranges").
#
#   kubectl --context kind-eg1 apply -f demos/51-eg-kube-vip/10-kubevip-cm-eg1.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubevip
  namespace: kube-system
data:
  range-default: 172.19.255.200-172.19.255.205
  range-envoy-gateway-system: 172.19.255.240-172.19.255.245
