# shop is the app namespace AND the Gateway namespace. The Certificate Secret `eg-tls`
# lands here; the Gateways live here too, so Envoy Gateway can mount the Secret without
# a ReferenceGrant. Cleanup deletes the namespace.
#
#   kubectl --context kind-eg1 apply -f demos/51-eg-kube-vip/00-namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
