# eg2's routes. Same shape as 50-routes-eg1.yaml; X-Served-By is eg2.
# VIP routes applied only where eg-vip-gw exists.
#
#   kubectl --context kind-eg2 apply -f demos/51-eg-kube-vip/50-routes-eg2.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-api, namespace: shop}
spec:
  parentRefs:
    - {name: eg2-gw, sectionName: https}
  hostnames: ["api.eg2.poc.local"]
  rules:
    - backendRefs: [{name: shopapi, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier: {set: [{name: X-Served-By, value: eg2}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-api-vip, namespace: shop}
spec:
  parentRefs:
    - {name: eg-vip-gw, sectionName: https}
  hostnames: ["api.eg.poc.local"]
  rules:
    - backendRefs: [{name: shopapi, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier: {set: [{name: X-Served-By, value: eg2}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-redirect, namespace: shop}
spec:
  parentRefs:
    - {name: eg2-gw, sectionName: http}
  hostnames: ["api.eg2.poc.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop-redirect-vip, namespace: shop}
spec:
  parentRefs:
    - {name: eg-vip-gw, sectionName: http}
  hostnames: ["api.eg.poc.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: {name: grpc, namespace: shop}
spec:
  parentRefs:
    - {name: eg2-gw, sectionName: https-grpc}
    - {name: eg2-gw, sectionName: http}
  hostnames: ["grpc.eg2.poc.local"]
  rules:
    - matches:
        - method:
            service: grpc.health.v1.Health
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1alpha.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: {name: grpc-vip, namespace: shop}
spec:
  parentRefs:
    - {name: eg-vip-gw, sectionName: https-grpc}
    - {name: eg-vip-gw, sectionName: http}
  hostnames: ["grpc.eg.poc.local"]
  rules:
    - matches:
        - method:
            service: grpc.health.v1.Health
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1alpha.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
    - matches:
        - method:
            service: grpc.reflection.v1.ServerReflection
      backendRefs: [{name: grpc, port: 9090}]
