# Demo 27 — the lab for the naming rule: TWO workloads that share app.kubernetes.io/name=shop and differ only by
# app.kubernetes.io/component (frontend, backend), the way the recommended labels model one application's parts.
# `pos` is the intended client of the frontend; the frontend is the intended client of the backend; `stranger` talks
# to both and is intended for neither. Every image is one already on the nodes (demo 09 / 19 / 26).
apiVersion: v1
kind: Namespace
metadata: {name: cf2cnp-lab27}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-frontend, namespace: cf2cnp-lab27, labels: {app.kubernetes.io/name: shop, app.kubernetes.io/component: frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-frontend}}
  template:
    metadata: {labels: {app: shop-frontend, app.kubernetes.io/name: shop, app.kubernetes.io/component: frontend}}
    spec:
      containers:
        - name: frontend                       # nginx serves :80 …
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
        - name: caller                         # … and a sidecar in the SAME pod (same Cilium endpoint identity) calls the backend
          image: alpine:3.20                   # every 5 s — so the flows are shop-frontend → shop-backend. (alpine's busybox has no
          command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-backend.cf2cnp-lab27/ >/dev/null 2>&1; sleep 5; done"]   # httpd applet: transcript Part 1b)
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: shop-frontend, namespace: cf2cnp-lab27}
spec: {selector: {app: shop-frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-backend, namespace: cf2cnp-lab27, labels: {app.kubernetes.io/name: shop, app.kubernetes.io/component: backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-backend}}
  template:
    metadata: {labels: {app: shop-backend, app.kubernetes.io/name: shop, app.kubernetes.io/component: backend}}
    spec:
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: shop-backend, namespace: cf2cnp-lab27}
spec: {selector: {app: shop-backend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: pos, namespace: cf2cnp-lab27, labels: {app: pos, app.kubernetes.io/name: pos}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-frontend.cf2cnp-lab27/ >/dev/null 2>&1; sleep 5; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: stranger, namespace: cf2cnp-lab27, labels: {app: stranger, app.kubernetes.io/name: stranger}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-frontend.cf2cnp-lab27/ >/dev/null 2>&1; wget -qO- --timeout=2 http://shop-backend.cf2cnp-lab27/ >/dev/null 2>&1; sleep 7; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
