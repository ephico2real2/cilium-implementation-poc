# nginx-unprivileged runs as UID 101; TLS ends here, not at Envoy (edge_sni passes it through).
server {
    listen 8443 ssl;
    http2 on;
    server_name web.fabric.localtest.me;

    ssl_certificate     /tls/web/tls.crt;
    ssl_certificate_key /tls/web/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # The pages call the API on its own hostname, on whatever port the browser used.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.fabric.localtest.me https://api.fabric.localtest.me:*; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=300" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /admin   { try_files /admin.html =404; }
    location = /        { try_files /index.html =404; }
    location /          { try_files $uri =404; }
}
