# Every target is scraped through Envoy's mesh_http listener (metrics.mesh), which routes
# /metrics/<target> to that component's own metrics port. Prometheus shares a network with
# Envoy only, so it cannot reach any component directly.
global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 10s

scrape_configs:
  - job_name: envoy
    metrics_path: /metrics/envoy
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: envoy}}]
    # Envoy names these counters without _total; give them the suffix Prometheus expects of a
    # counter, so rate() over them raises no "might not be a counter" notice.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: envoy_(cluster_upstream_rq_xx|cluster_upstream_rq_retry|cluster_upstream_rq_retry_success|http_downstream_rq_xx|listener_no_filter_chain_match)
        target_label: __name__
        replacement: envoy_${1}_total
  - job_name: orders-api
    metrics_path: /metrics/orders-api
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: orders-api}}]
  - job_name: worker
    metrics_path: /metrics/worker
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: worker}}]
  - job_name: tcp-svc
    metrics_path: /metrics/tcp-svc
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: tcp-svc}}]
  - job_name: mq
    metrics_path: /metrics/mq
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: mq}}]
  - job_name: postgres
    metrics_path: /metrics/postgres
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: postgres}}]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: pg_stat_database_(xact_commit|xact_rollback)
        target_label: __name__
        replacement: pg_stat_database_${1}_total
  - job_name: otel-collector
    metrics_path: /metrics/otel-collector
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: otel-collector}}]
  - job_name: tempo
    metrics_path: /metrics/tempo
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: tempo}}]
  - job_name: victoria-traces
    metrics_path: /metrics/victoria-traces
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: victoria-traces}}]
  - job_name: victoria-metrics
    metrics_path: /metrics/victoria-metrics
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: victoria-metrics}}]
  - job_name: victoria-logs
    metrics_path: /metrics/victoria-logs
    static_configs: [{targets: ["metrics.mesh:18080"], labels: {component: victoria-logs}}]
