receivers:
  # OTLP over HTTP only: Envoy routes otlp.mesh/v1/* here. gRPC needs an L4 route of its own
  # and is added only if a source cannot send HTTP (BACKLOG R1.1, "Open").
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

exporters:
  # Every store through its Envoy alias on mesh_http, never directly: the collector shares a
  # network with Envoy alone. Traces go to both Tempo and VictoriaTraces, to be compared.
  otlp_http/tempo:
    traces_endpoint: http://tempo.mesh:18080/v1/traces
  otlp_http/victoriatraces:
    traces_endpoint: http://victoriatraces.mesh:18080/insert/opentelemetry/v1/traces
  otlp_http/victoriametrics:
    metrics_endpoint: http://victoriametrics.mesh:18080/opentelemetry/v1/metrics
  otlp_http/victorialogs:
    logs_endpoint: http://victorialogs.mesh:18080/insert/opentelemetry/v1/logs

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # Prometheus expects counter `_total` suffixes; without them rate() warns and standard-name queries find nothing.
                without_type_suffix: false
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo, otlp_http/victoriatraces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/victoriametrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/victorialogs]
