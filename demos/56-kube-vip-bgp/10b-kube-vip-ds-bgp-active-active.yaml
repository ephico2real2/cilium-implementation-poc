# kube-vip v1.2.4 in BGP mode, active-active (the final state). Same
# DaemonSet as 10a except vip_arp=false and svc_election=false.
# configureService then runs on every node
# (!EnableARP && !EnableRoutingTable — pkg/services/services.go:203-206).
# kube-vip's docs: "When using BGP without leader election … all nodes
# announce the VIP and usually an upstream router distributes traffic
# via ECMP". The spine holds TWO paths per /32.
#
# Consequence: demo 54's L2 doors (.100/.101) stop answering — nobody
# ARPs for them once vip_arp is off. This file is the migration, not a
# second announcer beside L2. cleanup.sh restores
# clusters/eg/kube-vip-ds.yaml so those doors answer ARP again.
#
# Password inline in bgp_peers: one password per fabric (sheet row 3;
# FABRIC_BGP_PASSWORD=lab-bgp in demos/46-bgp-fabric/fabric/.env).
# lb_class_only / lb_class_name unchanged (D11). Cloud-provider unchanged.
#
#   kubectl --context kind-eg-poc1 apply -f demos/56-kube-vip-bgp/10b-kube-vip-ds-bgp-active-active.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: kube-vip-ds
    app.kubernetes.io/version: v1.2.4
  name: kube-vip-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-ds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-ds
        app.kubernetes.io/version: v1.2.4
    spec:
      hostNetwork: true
      serviceAccountName: kube-vip
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.2.4
          imagePullPolicy: IfNotPresent
          args: [manager]
          env:
            - name: vip_arp
              value: "false"
            - name: port
              value: "6443"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: vip_interface
              value: eth0
            - name: dns_mode
              value: first
            - name: dhcp_mode
              value: ipv4
            - name: svc_enable
              value: "true"
            - name: svc_leasename
              value: plndr-svcs-lock
            - name: svc_election
              value: "false"
            - name: lb_class_only
              value: "true"
            - name: lb_class_name
              value: kube-vip.io/kube-vip-class
            # vip_leaderelection=false too: kube-vip v1.2.4 logs "leader election is enabled, only the
            # elected leader will advertise service VIPs; unset enable_leader_election to keep
            # advertising from every node (ECMP)" (measured 2026-09-20 — with it on, the spine had
            # no path for 90 s after the switch)
            - name: vip_leaderelection
              value: "false"
            - name: vip_leasename
              value: plndr-cp-lock
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            - name: prometheus_server
              value: ":2112"
            - name: bgp_enable
              value: "true"
            - name: bgp_as
              value: "65021"
            # bgp_peers carries NO password: gobgp sets TCP_MD5SIG on its connecting socket
            # and this Docker VM's kernel refuses it (Protocol not available) — with a password
            # the session never leaves ACTIVE (measured 2026-09-20: 90 s, no SYN on the leaf);
            # without, both nodes are Established in 25 s. The fabric's `neighbor SERVERS
            # password` stays: FRR fails the same setsockopt and continues unsigned. On a real
            # kernel both sides sign (NETWORK-TEAM-SHEET.md row 3).
            - name: bgp_peers
              value: "172.19.254.11:65101::false,172.19.254.12:65102::false"
            - name: bgp_routerid
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: bgp_sourceif
              value: eth0
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
              drop: [ALL]
