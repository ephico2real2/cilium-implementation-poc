# kube-vip v1.2.4 in BGP mode, leader-only (the first setting this demo
# measures). Same DaemonSet as clusters/eg/kube-vip-ds.yaml plus the BGP
# env. vip_arp=false (kube-vip v1.2.4 refuses two modes at once —
# cmd/kube-vip.go:367-392 "multiple kube-vip modes detected", measured:
# CrashLoopBackOff with ARP and BGP both on) and svc_election=true:
# configureService (which adds the VIP to BGP) runs only on the elected leader
# (kube-vip v1.2.4 pkg/services/services.go:203-206,
# pkg/services/leader.go:146 OnStartedLeading). The spine therefore
# holds ONE path per /32.
#
# bgp_peers format is address:AS:password:multihop. The password is the
# fabric's one MD5 (FABRIC_BGP_PASSWORD in demos/46-bgp-fabric/fabric/.env,
# default lab-bgp) — kube-vip takes it inline in this string; the sheet's
# row 3 is "one password per fabric". 65101 / 65102 are the leaves' ASNs,
# not TCP ports (BGP is 179).
#
# bgp_routerid from the downward API (status.hostIP — kube-vip's docs:
# "typically the address of the local node"). hostNetwork is already on.
# bgp_sourceif=eth0 is set so apply.sh can record whether sessions come
# up with it (measure whether it is needed).
#
# lb_class_only / lb_class_name unchanged (D11). The cloud-provider is
# not in this file (static addresses by annotation, outside its ranges —
# measured in demos 51/54).
#
# Active-active is 10b (vip_arp=false, svc_election=false). This demo is
# the MIGRATION of eg-poc1 from L2 to BGP: demo 54's doors (.100/.101)
# stop answering ARP once 10b is applied. cleanup.sh restores
# clusters/eg/kube-vip-ds.yaml.
#
#   kubectl --context kind-eg-poc1 apply -f demos/56-kube-vip-bgp/10a-kube-vip-ds-bgp-election.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: kube-vip-ds
    app.kubernetes.io/version: v1.2.4
  name: kube-vip-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-ds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-ds
        app.kubernetes.io/version: v1.2.4
    spec:
      hostNetwork: true
      serviceAccountName: kube-vip
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.2.4
          imagePullPolicy: IfNotPresent
          args: [manager]
          env:
            - name: vip_arp
              value: "false"
            - name: port
              value: "6443"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: vip_interface
              value: eth0
            - name: dns_mode
              value: first
            - name: dhcp_mode
              value: ipv4
            - name: svc_enable
              value: "true"
            - name: svc_leasename
              value: plndr-svcs-lock
            - name: svc_election
              value: "true"
            - name: lb_class_only
              value: "true"
            - name: lb_class_name
              value: kube-vip.io/kube-vip-class
            - name: vip_leaderelection
              value: "true"
            - name: vip_leasename
              value: plndr-cp-lock
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            - name: prometheus_server
              value: ":2112"
            - name: bgp_enable
              value: "true"
            - name: bgp_as
              value: "65021"
            # bgp_peers carries NO password: gobgp sets TCP_MD5SIG on its connecting socket
            # and this Docker VM's kernel refuses it (Protocol not available) — with a password
            # the session never leaves ACTIVE (measured 2026-09-20: 90 s, no SYN on the leaf);
            # without, both nodes are Established in 25 s. The fabric's `neighbor SERVERS
            # password` stays: FRR fails the same setsockopt and continues unsigned. On a real
            # kernel both sides sign (NETWORK-TEAM-SHEET.md row 3).
            - name: bgp_peers
              value: "172.19.254.11:65101::false,172.19.254.12:65102::false"
            - name: bgp_routerid
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: bgp_sourceif
              value: eth0
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
              drop: [ALL]
