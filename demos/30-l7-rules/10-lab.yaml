# Demo 30 — the shop lab of demo 27 in its own namespace, with nginx serving REAL paths (a ConfigMap, so every
# answer below is a 200 and the only thing that can turn one into a 403 is the policy) and callers that use
# several of them. pos is the intended client of the frontend (/, /checkout); the frontend's sidecar is the
# intended client of the backend (/api/orders, with a query string once); stranger calls both and is intended
# for neither. Nobody calls /admin — the path that must end up denied.
apiVersion: v1
kind: Namespace
metadata: {name: cf2cnp-lab30}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: shop-nginx, namespace: cf2cnp-lab30}
data:
  default.conf: |
    server {
      listen 80;
      location = /            { return 200 "shop\n"; }
      location /checkout      { return 200 "checkout\n"; }
      location /api/orders    { return 200 "orders\n"; }
      location /admin         { return 200 "admin\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-frontend, namespace: cf2cnp-lab30, labels: {app.kubernetes.io/name: shop, app.kubernetes.io/component: frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-frontend}}
  template:
    metadata: {labels: {app: shop-frontend, app.kubernetes.io/name: shop, app.kubernetes.io/component: frontend}}
    spec:
      volumes: [{name: conf, configMap: {name: shop-nginx}}]
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
        - name: caller                         # same pod = same identity: the flows are shop-frontend → shop-backend
          image: alpine:3.20
          command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-backend.cf2cnp-lab30/api/orders >/dev/null 2>&1; wget -qO- --timeout=2 'http://shop-backend.cf2cnp-lab30/api/orders?id=42' >/dev/null 2>&1; sleep 5; done"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: shop-frontend, namespace: cf2cnp-lab30}
spec: {selector: {app: shop-frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-backend, namespace: cf2cnp-lab30, labels: {app.kubernetes.io/name: shop, app.kubernetes.io/component: backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-backend}}
  template:
    metadata: {labels: {app: shop-backend, app.kubernetes.io/name: shop, app.kubernetes.io/component: backend}}
    spec:
      volumes: [{name: conf, configMap: {name: shop-nginx}}]
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: shop-backend, namespace: cf2cnp-lab30}
spec: {selector: {app: shop-backend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: pos, namespace: cf2cnp-lab30, labels: {app: pos, app.kubernetes.io/name: pos}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-frontend.cf2cnp-lab30/ >/dev/null 2>&1; wget -qO- --timeout=2 http://shop-frontend.cf2cnp-lab30/checkout >/dev/null 2>&1; sleep 5; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: stranger, namespace: cf2cnp-lab30, labels: {app: stranger, app.kubernetes.io/name: stranger}}
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "while true; do wget -qO- --timeout=2 http://shop-frontend.cf2cnp-lab30/admin >/dev/null 2>&1; wget -qO- --timeout=2 http://shop-backend.cf2cnp-lab30/api/orders >/dev/null 2>&1; sleep 7; done"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
