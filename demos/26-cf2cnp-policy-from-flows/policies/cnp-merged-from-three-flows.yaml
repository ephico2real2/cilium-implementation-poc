apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pos
  namespace: cf2cnp-lab
spec:
  description: Allow egress traffic from cf2cnp-lab to 104.20.23.154 for the pos
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pos
  egress:
    - toCIDR:
        - 104.20.23.154/32
    # To allow all traffic to world instead of specific IPs, replace toCIDR with:
    # - toEntities:
    #     - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shop
  namespace: cf2cnp-lab
spec:
  description: Allow ingress traffic for the shop in cf2cnp-lab (2 rules merged from 2 observed flows)
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: shop
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: pos
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: stranger
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
