# rendered by demos/19-zero-trust-cell/render.py from intent.yaml — cluster-aware: poc1,poc2
# apply this SAME file to every cluster the cell spans
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cell-web
  namespace: bank
  labels:
    cell: bank
    rendered-from: intent.yaml
  annotations:
    visibility: external
spec:
  description: 'web: rendered from intent.yaml (visibility=external); do not edit'
  endpointSelector:
    matchLabels:
      app: web
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
      rules:
        http:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cell-api
  namespace: bank
  labels:
    cell: bank
    rendered-from: intent.yaml
  annotations:
    visibility: external,project
spec:
  description: 'api: rendered from intent.yaml (visibility=external,project); do not
    edit'
  endpointSelector:
    matchLabels:
      app: api
  ingress:
  - fromEntities:
    - ingress
    toPorts: &id001
    - ports:
      - port: '8080'
        protocol: TCP
      rules:
        http:
        - {}
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: bank
      matchExpressions:
      - key: io.cilium.k8s.policy.cluster
        operator: In
        values:
        - poc1
        - poc2
    toPorts: *id001
---
