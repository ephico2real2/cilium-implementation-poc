# kube-vip cloud-provider ranges (enhancement 007 §3.1 / issue #54).
# range-default: ordinary Services in default (probe .200).
# range-envoy-gateway-system: Envoy Gateway's generated Services (.240–.245).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubevip
  namespace: kube-system
data:
  range-default: 172.19.255.200-172.19.255.205
  range-envoy-gateway-system: 172.19.255.240-172.19.255.245
