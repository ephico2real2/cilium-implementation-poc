# R0.5 — the same experiment on MetalLB's class + .246.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: probe-gw-metallb-proxy
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        loadBalancerClass: metallb.io/metallb
        annotations:
          metallb.io/loadBalancerIPs: "172.19.255.246"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: probe-gw-metallb
  namespace: default
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: probe-gw-metallb-proxy
  addresses:
    - type: IPAddress
      value: 172.19.255.246
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
