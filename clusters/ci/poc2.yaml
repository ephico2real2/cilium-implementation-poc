# clusters/ci/poc2.yaml — the CI shape of clusters/poc2.yaml (enhancement 004): one control plane and one worker, because a
# GitHub-hosted runner for a public repository is 4 vCPU / 16 GB and a job builds two of these plus Cilium. Everything
# else is the lab's: no kindnet, no kube-proxy (Cilium replaces both), the same non-overlapping CIDRs ClusterMesh needs,
# the same pinned node image (Kubernetes v1.36.4, the newest Cilium 1.20.1 is tested on). With one control plane there is
# no kind load-balancer container, so Cilium's k8sServiceHost is the control-plane node's name (scripts/lab-up.sh).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poc2
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: "10.20.0.0/16"
  serviceSubnet: "10.21.0.0/16"
nodes:
  - role: control-plane
    # No taint on the control plane (cilium/cilium's own kind template does the same, "otherwise additional worker
    # node might be required for conformance testing"): `cilium connectivity test` schedules echo-other-node on a
    # SECOND schedulable node, and with one worker it waited for it forever — the fourth spike run sat 23 minutes in
    # that step (cilium/cilium-cli#2186). kind picks the kubeadm apiVersion by Kubernetes version (v1beta4 from
    # v1.36); a patch whose apiVersion does not match is silently ignored, so both are listed.
    kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta3
        kind: InitConfiguration
        nodeRegistration:
          taints: []
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: InitConfiguration
        nodeRegistration:
          taints: []
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
