# poc4 — a THROWAWAY cluster for demo 13 (ztunnel). It exists because ztunnel cannot run on poc1:
# the chart sets CILIUM_CLUSTERMESH_CONFIG unconditionally and Cilium's ClusterMesh object is nil
# only when cluster.id == 0 — poc1 is cluster.id 1 for the mesh, so the agent refuses to start
# ("ztunnel is not compatible with clustermesh"). poc4 keeps the chart default cluster.id 0 and is
# never meshed. Own docker network (NETWORKING_DESIGN §2b), disjoint CIDRs, deleted when the demo ends.
#
#   docker network create --subnet 172.31.0.0/16 --gateway 172.31.0.1 kind-lab
#   KIND_EXPERIMENTAL_DOCKER_NETWORK=kind-lab kind create cluster --config clusters/poc4.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poc4
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: "10.40.0.0/16"
  serviceSubnet: "10.41.0.0/16"
nodes:
  - role: control-plane
    # demo 17 (Tetragon): the host /proc, mounted where Tetragon expects it (tetragon.hostProcPath=/procHost).
    # kind nodes run in their own PID namespace; without this Tetragon loses pod/binary attribution SILENTLY
    # (tetragon#4883). Creation-time only — added 2026-09-12; a cluster created before that date lacks it.
    extraMounts:
      - hostPath: /proc
        containerPath: /procHost
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    # demo 17 (Tetragon): the host /proc, mounted where Tetragon expects it (tetragon.hostProcPath=/procHost).
    # kind nodes run in their own PID namespace; without this Tetragon loses pod/binary attribution SILENTLY
    # (tetragon#4883). Creation-time only — added 2026-09-12; a cluster created before that date lacks it.
    extraMounts:
      - hostPath: /proc
        containerPath: /procHost
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    # demo 17 (Tetragon): the host /proc, mounted where Tetragon expects it (tetragon.hostProcPath=/procHost).
    # kind nodes run in their own PID namespace; without this Tetragon loses pod/binary attribution SILENTLY
    # (tetragon#4883). Creation-time only — added 2026-09-12; a cluster created before that date lacks it.
    extraMounts:
      - hostPath: /proc
        containerPath: /procHost
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
